<script>
/* ================== Utilidades ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtD = ms => ms ? new Date(ms).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: '2-digit' }) : '—';
const fmtDT = ms => ms ? new Date(ms).toLocaleString('es-CO', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtN = n => Math.round(n || 0).toLocaleString('es-CO');
const money = v => '$' + fmtN(v);
const moneyM = v => '$' + ((v || 0) / 1e6).toLocaleString('es-CO', { maximumFractionDigits: 1 }) + ' M';
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const uniq = a => [...new Set(a)].filter(v => v !== '' && v != null).sort();
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const groupBy = (arr, fn) => { const m = new Map(); arr.forEach(x => { const k = typeof fn === 'function' ? fn(x) : x[fn]; if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; };
const sum = (arr, fn) => arr.reduce((t, x) => t + (fn(x) || 0), 0);
const q = (arr, p) => { if (!arr.length) return 0; const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(s.length * p))]; };
const guardar = (k, v) => { try { localStorage.setItem('ca_' + k, JSON.stringify(v)); } catch (e) {} };
const recuperar = (k, d) => { try { const v = localStorage.getItem('ca_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };

/* ================== Servidor ================== */
let cargando = 0;
function barra(on) { cargando += on ? 1 : -1; const b = $('#loadbar'); if (b) b.classList.toggle('on', cargando > 0); }
function llamar(fn, ...args) {
  barra(true);
  return new Promise((res, rej) => {
    google.script.run
      .withSuccessHandler(r => { barra(false); if (r && r.ok) res(r.data); else rej(new Error((r && r.error) || 'Sin respuesta del servidor.')); })
      .withFailureHandler(e => { barra(false); rej(new Error(e && e.message ? e.message : 'No hubo conexión con el servidor.')); })[fn](...args);
  });
}
const API = {
  pub: (accion, datos) => llamar('publico', accion, datos),
  call: (accion, datos) => llamar('api', S.token, accion, datos).catch(e => { if (e.message === 'SESION_EXPIRADA') { salir('Tu sesión venció. Ingresa de nuevo.'); } throw e; })
};

/* ================== Avisos y capas ================== */
function toast(msg, tipo) {
  const t = document.createElement('div');
  t.className = 'toast' + (tipo === 'error' ? ' error' : '');
  t.textContent = msg; t.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
  $('#toasts').appendChild(t);
  if (tipo === 'error') t.onclick = () => t.remove(); else setTimeout(() => t.remove(), 4500);
}
const fallo = e => toast(e.message || String(e), 'error');
function drawer(titulo, sub, cuerpo) {
  $('#layer').innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="dr-h"><div><div class="crumb">${sub}</div><h2>${titulo}</h2></div><button class="x" data-close aria-label="Cerrar">×</button></div><div class="dr-b">${cuerpo}</div></aside>`;
  setTimeout(() => { const f = $('#layer .dr-b input, #layer .dr-b select, #layer .dr-b textarea') || $('#layer .x'); f && f.focus(); }, 30);
}
const cerrarCapa = () => { $('#layer').innerHTML = ''; };
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) cerrarCapa(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#pop').innerHTML) cerrarPop(); else cerrarCapa(); } });

function descargar(r) {
  const bin = atob(r.b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
  const a = document.createElement('a'); a.href = url; a.download = r.nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  toast('Descargado: ' + r.nombre);
}

/* ================== Gráficos ================== */
const charts = {};
const SER = () => ['--s1', '--s2', '--s3', '--s4', '--s5'].map(css);
const RAMP = () => ['--q1', '--q2', '--q3', '--q4', '--q5', '--q6'].map(css);
function chart(id, cfg) {
  const el = document.getElementById(id); if (!el) return;
  if (typeof Chart === 'undefined') { el.parentElement.innerHTML = '<div class="empty">Los gráficos necesitan conexión a internet.</div>'; return; }
  if (charts[id]) charts[id].destroy();
  Chart.defaults.font.family = 'IBM Plex Sans, system-ui, sans-serif'; Chart.defaults.color = css('--muted');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const base = { responsive: true, maintainAspectRatio: false, animation: { duration: reduce ? 0 : 600 }, interaction: { mode: 'nearest', intersect: false },
    plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true } }, tooltip: { backgroundColor: css('--ink'), padding: 10, cornerRadius: 8 } } };
  const propias = cfg.options || {}, basePlugins = base.plugins;
  cfg.options = Object.assign(base, propias);
  cfg.options.plugins = Object.assign({}, basePlugins, propias.plugins || {});
  cfg.options.plugins.tooltip = Object.assign({}, basePlugins.tooltip, (propias.plugins || {}).tooltip || {});
  if (cfg.type !== 'doughnut') { cfg.options.scales = cfg.options.scales || {}; for (const ax of ['x', 'y']) cfg.options.scales[ax] = Object.assign({ grid: { color: css('--line'), drawTicks: false }, border: { display: false }, ticks: { padding: 6 } }, cfg.options.scales[ax] || {}); }
  (cfg.data.datasets || []).forEach(d => { const t = d.type || cfg.type; if (t === 'bar') { d.borderRadius = d.borderRadius ?? 4; d.borderSkipped = d.borderSkipped ?? 'start'; d.borderWidth = d.borderWidth ?? 0; } if (t === 'line') { d.borderWidth = d.borderWidth ?? 2; d.pointRadius = d.pointRadius ?? 3; d.pointHoverRadius = 5; } });
  charts[id] = new Chart(el, cfg);
}
function countUp(root) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-count]').forEach(el => {
    const end = +el.dataset.count, f0 = el.dataset.fmt;
    const f = v => f0 === 'm' ? moneyM(v) : f0 === 'h' ? Math.round(v) + ' h' : f0 === 'p' ? Math.round(v) + '%' : fmtN(v);
    if (reduce || !isFinite(end)) { el.textContent = f(end || 0); return; }
    const t0 = performance.now(); const st = t => { const k = Math.min(1, (t - t0) / 650); el.textContent = f(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(st); };
    el.textContent = f(0); requestAnimationFrame(st);
  });
}
function kpi(lbl, val, foot, color, accion, fmt, delta, sel) {
  const d = delta == null ? '' : `<span class="delta" style="color:var(${delta.good ? '--ok' : '--crit'})">${delta.v > 0 ? '▲' : delta.v < 0 ? '▼' : '='} ${Math.abs(delta.v)}${delta.u || ''}</span> `;
  const tag = accion ? 'button' : 'div';
  return `<${tag} class="kpi ${sel ? 'sel' : ''}" style="--k:var(${color})" ${accion || ''}><div class="lbl">${lbl}</div><div class="val" data-count="${val}" data-fmt="${fmt || ''}">${val}</div><div class="foot">${d}${foot}</div></${tag}>`;
}
const legend = items => `<div class="legend">${items.map(i => `<span><i class="dotl" style="background:${i[1]}"></i>${i[0]}</span>`).join('')}</div>`;

/* ================== Tabla ordenable y paginada ================== */
const TBL = {};
function table(key, cols, rows, onRow, opt = {}) {
  const st = S.sort[key] || {}, per = opt.per || 15;
  if (st.c != null && cols[st.c]) { const c = cols[st.c]; rows = [...rows].sort((a, b) => { const va = c.s ? c.s(a) : '', vb = c.s ? c.s(b) : ''; return (va > vb ? 1 : va < vb ? -1 : 0) * (st.d || 1); }); }
  const tot = rows.length, pages = Math.max(1, Math.ceil(tot / per)), p = Math.min(S.page[key] || 0, pages - 1), sl = rows.slice(p * per, p * per + per);
  TBL[key] = { rows, onRow };
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map((c, i) => `<th class="${c.cl || ''}" data-sort="${key}:${i}" scope="col">${c.h}${st.c === i ? (st.d > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>
  ${sl.length ? sl.map((r, i) => `<tr class="${onRow ? 'row' : ''} ${r._sub ? 'sub' : ''}" ${onRow ? `data-row="${key}:${p * per + i}" tabindex="0"` : ''}>${cols.map(c => `<td class="${c.cl || ''}">${c.v(r)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}"><div class="empty">${opt.vacio || 'No hay registros con estos filtros.'}</div></td></tr>`}
  </tbody></table><div class="pager"><span class="num">${fmtN(tot)} registros</span>${tot > per ? `<span><button class="btn ghost sm" data-pg="${key}:${p - 1}" ${p === 0 ? 'disabled' : ''}>Anterior</button><span class="num">&nbsp;${p + 1} / ${pages}&nbsp;</span><button class="btn ghost sm" data-pg="${key}:${p + 1}" ${p >= pages - 1 ? 'disabled' : ''}>Siguiente</button></span>` : ''}</div></div>`;
}
document.addEventListener('click', e => {
  const th = e.target.closest('[data-sort]'); if (th) { const [k, i] = th.dataset.sort.split(':'); const st = S.sort[k] || {}; S.sort[k] = { c: +i, d: st.c === +i ? -(st.d || 1) : -1 }; render(false); return; }
  const pg = e.target.closest('[data-pg]'); if (pg) { const [k, p] = pg.dataset.pg.split(':'); S.page[k] = +p; render(false); return; }
  const tr = e.target.closest('[data-row]'); if (tr) { const [k, i] = tr.dataset.row.split(':'); const t = TBL[k]; if (t && t.onRow) t.onRow(t.rows[+i]); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-row]')) e.target.click(); });

/* ================== Filtros por facetas ==================
   Cada lista desplegable muestra cuántos registros hay por opción, calculados con los demás filtros aplicados.
   Así las listas se vuelven dependientes (al elegir un área, Ala solo muestra las de esa área). */
function filtrar(rows, defs, f, excepto) {
  return rows.filter(x => defs.every(d => {
    if (d.k === excepto) return true;
    const sel = f[d.k]; if (!sel || !sel.length) return true;
    const v = d.get(x); return Array.isArray(v) ? v.some(z => sel.includes(z)) : sel.includes(v);
  }));
}
function opcionesFaceta(rows, defs, f, k) {
  const d = defs.find(z => z.k === k), base = filtrar(rows, defs, f, k), m = new Map();
  base.forEach(x => { let v = d.get(x); (Array.isArray(v) ? v : [v]).forEach(z => { z = z === '' || z == null ? '(vacío)' : z; m.set(z, (m.get(z) || 0) + 1); }); });
  (f[k] || []).forEach(v => { if (!m.has(v)) m.set(v, 0); });
  let out = [...m.entries()].map(([v, n]) => ({ v, l: d.lbl ? d.lbl(v) : v, n }));
  if (d.orden) out.sort((a, b) => d.orden.indexOf(a.v) - d.orden.indexOf(b.v));
  else if (d.grupo) out.sort((a, b) => String(d.grupo(a.v)).localeCompare(String(d.grupo(b.v))) || b.n - a.n);
  else out.sort((a, b) => b.n - a.n || String(a.l).localeCompare(String(b.l)));
  return out;
}
/** Barra de filtros: búsqueda + listas desplegables agrupadas + filtros activos. */
function barraFiltros(vista, rows, defs, placeholder) {
  const f = S.f; COMBOS[vista] = { rows, defs };
  let grp = null, html = `<div class="fbar"><label class="search"><span hidden>Buscar</span><input type="search" data-fs="q" placeholder="${placeholder || 'Buscar'}" value="${esc(f.q || '')}" aria-label="Buscar"></label>`;
  defs.forEach(d => {
    if (d.oculto) return;
    if (d.grp && d.grp !== grp) { if (grp) html += '<span class="grp-sep" aria-hidden="true"></span>'; grp = d.grp; }
    const sel = f[d.k] || [];
    const v = !sel.length ? 'Todos' : sel.length === 1 ? (d.lbl ? d.lbl(sel[0]) : sel[0]) : sel.length + ' seleccionados';
    html += `<button class="cb ${sel.length ? 'act' : ''}" data-cb="${vista}|${d.k}" aria-haspopup="listbox"><span class="lbl">${d.t}</span><span class="v">${esc(v)}</span><span class="chev">▾</span></button>`;
  });
  html += '</div>';
  const act = defs.filter(d => (f[d.k] || []).length);
  if (act.length || f.q) html += `<div class="active-f"><span>Filtrando:</span>${f.q ? `<button data-clr="q">“${esc(f.q)}” ✕</button>` : ''}${act.map(d => (f[d.k]).map(v => `<button data-clr="${d.k}|${esc(v)}">${d.t}: ${esc(d.lbl ? d.lbl(v) : v)} ✕</button>`).join('')).join('')}<button data-clr="*">Quitar todos</button></div>`;
  return html;
}
function aplicarFiltros(rows, defs, buscar) {
  let r = filtrar(rows, defs, S.f);
  if (S.f.q) { const t = S.f.q.toUpperCase(); r = r.filter(x => buscar(x).toUpperCase().includes(t)); }
  return r;
}
const COMBOS = {};
let popState = null;
function cerrarPop() { $('#pop').innerHTML = ''; popState = null; }
function abrirCombo(btn) {
  const [vista, k] = btn.dataset.cb.split('|'), C = COMBOS[vista]; if (!C) return;
  const d = C.defs.find(z => z.k === k);
  popState = { vista, k, d, btn: btn.dataset.cb, filtro: '', kb: -1 };
  pintarCombo(btn.getBoundingClientRect());
}
function pintarCombo(rect) {
  const P = popState; if (!P) return;
  const C = COMBOS[P.vista], opts = opcionesFaceta(C.rows, C.defs, S.f, P.k), sel = S.f[P.k] || [];
  const texto = o => (String(o.l) + ' ' + (P.d.grupo ? P.d.grupo(o.v) : '')).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  const busca = P.filtro.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  const vis = opts.filter(o => !busca || texto(o).includes(busca));
  const r = rect || P.rect; P.rect = r;
  const left = Math.max(8, Math.min(r.left, innerWidth - 336)), top = Math.min(r.bottom + 6, innerHeight - 200);
  let grupoActual = null;
  const lista = vis.map((o, i) => { let g = ''; if (P.d.grupo) { const gg = P.d.grupo(o.v); if (gg !== grupoActual) { grupoActual = gg; g = `<div class="cbp-grp">${esc(gg)}</div>`; } }
    return g + `<label class="cbp-o ${o.n ? '' : 'zero'} ${i === P.kb ? 'kb' : ''}" data-i="${i}"><input type="${P.d.unico ? 'radio' : 'checkbox'}" name="cbp" data-v="${esc(o.v)}" ${sel.includes(o.v) ? 'checked' : ''}><span>${esc(o.l)}</span><span class="n">${fmtN(o.n)}</span></label>`; }).join('');
  $('#pop').innerHTML = `<div class="cbp" role="listbox" aria-label="${esc(P.d.t)}" style="left:${left}px;top:${top}px">
    <div class="cbp-h"><input type="search" id="cbpq" placeholder="Buscar en ${esc(P.d.t.toLowerCase())}" value="${esc(P.filtro)}" aria-label="Buscar opción"><div class="row"><span class="muted">${fmtN(opts.length)} opciones</span><span>${P.d.unico ? '' : '<button data-cbx="todos">Marcar visibles</button> · '}<button data-cbx="limpiar">Limpiar</button></span></div></div>
    <div class="cbp-l">${lista || '<div class="empty">Sin coincidencias</div>'}</div>
    <div class="cbp-f"><span>${sel.length ? sel.length + ' seleccionado' + (sel.length > 1 ? 's' : '') : 'Sin filtro'}</span><button class="btn sm" data-cbx="cerrar">Listo</button></div></div>`;
  const inp = $('#cbpq'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  P.vis = vis;
}
function toggleCombo(v, forzar) {
  const P = popState, sel = new Set(S.f[P.k] || []);
  if (P.d.unico) { S.f[P.k] = sel.has(v) && !forzar ? [] : [v]; }
  else { if (sel.has(v) && forzar !== true) sel.delete(v); else sel.add(v); S.f[P.k] = [...sel]; }
  S.page = {}; render(false); pintarCombo();
  if (P.d.unico) cerrarPop();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cb]'); if (b) { e.preventDefault(); if (popState && popState.btn === b.dataset.cb) cerrarPop(); else abrirCombo(b); return; }
  const x = e.target.closest('[data-cbx]');
  if (x && popState) { const a = x.dataset.cbx;
    if (a === 'limpiar') { S.f[popState.k] = []; S.page = {}; render(false); pintarCombo(); }
    if (a === 'todos') { S.f[popState.k] = uniq([...(S.f[popState.k] || []), ...popState.vis.map(o => o.v)]); S.page = {}; render(false); pintarCombo(); }
    if (a === 'cerrar') cerrarPop(); return; }
  if (popState && !e.target.closest('.cbp')) cerrarPop();
  const cl = e.target.closest('[data-clr]'); if (cl) { const v = cl.dataset.clr;
    if (v === '*') Object.keys(S.f).forEach(k => { S.f[k] = Array.isArray(S.f[k]) ? [] : ''; });
    else if (v === 'q') S.f.q = ''; else { const [k, val] = v.split('|'); S.f[k] = (S.f[k] || []).filter(z => z !== val); }
    S.page = {}; render(false); }
});
document.addEventListener('change', e => { const i = e.target.closest('.cbp-o input'); if (i && popState) toggleCombo(i.dataset.v); });
document.addEventListener('input', e => { if (e.target.id === 'cbpq' && popState) { popState.filtro = e.target.value; popState.kb = -1; pintarCombo(); } });
document.addEventListener('keydown', e => {
  if (!popState || e.target.id !== 'cbpq') return;
  const n = (popState.vis || []).length;
  if (e.key === 'ArrowDown') { e.preventDefault(); popState.kb = Math.min(n - 1, popState.kb + 1); pintarCombo(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); popState.kb = Math.max(0, popState.kb - 1); pintarCombo(); }
  if (e.key === 'Enter') { e.preventDefault(); const o = popState.vis[popState.kb >= 0 ? popState.kb : 0]; if (o) toggleCombo(o.v); }
});
addEventListener('resize', () => cerrarPop());
let busT; document.addEventListener('input', e => { const f = e.target.closest('[data-fs]'); if (!f) return; clearTimeout(busT); busT = setTimeout(() => { S.f[f.dataset.fs] = f.value; S.page = {}; render(false); const el = document.querySelector(`[data-fs="${f.dataset.fs}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 250); });

/* ================== Búsqueda con sugerencias (servidor o lista local) ================== */
function autocompletar(id, buscar, alElegir) {
  const inp = document.getElementById(id); if (!inp) return;
  const caja = document.createElement('div'); caja.className = 'ac-l'; caja.hidden = true; inp.parentElement.classList.add('ac'); inp.parentElement.appendChild(caja);
  let t, ops = [], kb = -1;
  const pintar = () => { caja.innerHTML = ops.map((o, i) => `<div class="ac-o ${i === kb ? 'kb' : ''}" data-i="${i}">${esc(o.l)}</div>`).join('') || '<div class="empty">Sin resultados</div>'; caja.hidden = false; };
  inp.addEventListener('input', () => { clearTimeout(t); const v = inp.value.trim(); if (v.length < 2) { caja.hidden = true; return; } t = setTimeout(async () => { try { ops = await buscar(v); kb = -1; pintar(); } catch (e) { fallo(e); } }, 280); });
  inp.addEventListener('keydown', e => { if (caja.hidden) return; if (e.key === 'ArrowDown') { e.preventDefault(); kb = Math.min(ops.length - 1, kb + 1); pintar(); } if (e.key === 'ArrowUp') { e.preventDefault(); kb = Math.max(0, kb - 1); pintar(); } if (e.key === 'Enter' && ops[Math.max(0, kb)]) { e.preventDefault(); elegir(ops[Math.max(0, kb)]); } if (e.key === 'Escape') caja.hidden = true; });
  caja.addEventListener('mousedown', e => { const o = e.target.closest('.ac-o'); if (o) { e.preventDefault(); elegir(ops[+o.dataset.i]); } });
  inp.addEventListener('blur', () => setTimeout(() => { caja.hidden = true; }, 150));
  function elegir(o) { inp.value = o.l; caja.hidden = true; alElegir(o); }
}
</script>
