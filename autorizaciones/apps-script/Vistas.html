<script>
/* ================== Formatos compartidos ================== */
function slaPill(a) {
  const h = horas(a), p = P();
  if (!abierta(a)) return `<span class="pill ${a.est === 'AUTORIZADO' ? (h <= p.META_AUT_HORAS ? 'p-ok' : 'p-warn') : 'p-mut'}">${a.fs && (a.fr || !abierta(a)) ? Math.round(h) + ' h' : '—'}</span>`;
  return h > p.CRITICO_AUT_HORAS ? `<span class="pill p-crit">● ${Math.round(h)} h · crítica</span>` : h > p.META_AUT_HORAS ? `<span class="pill p-warn">● ${Math.round(h)} h · sobre meta</span>` : `<span class="pill p-ok">● ${Math.round(h)} h</span>`;
}
const nivelSla = a => { const h = horas(a), p = P(); return h > p.CRITICO_AUT_HORAS ? 'Crítica' : h > p.META_AUT_HORAS ? 'Sobre la meta' : 'En tiempo'; };
const estPill = e => `<span class="pill ${EA_PILL[e] || 'p-mut'}">${e}</span>`;
const fuentePill = a => a.fuente === 'CODIGO' ? `<span class="pill p-warn" title="Detectada en la columna RESPONSABLE">Código ${esc(a.cod)}</span>` : '<span class="pill p-acc">Registrada</span>';
const sitPill = s => `<span class="pill ${SIT_PILL[s] || 'p-mut'}">${SIT_LBL[s] || s}</span>`;
const ecPill = e => `<span class="pill ${EC_PILL[e] || 'p-mut'}">${EC_LBL[e] || e}</span>`;
const bucketDias = d => d <= 7 ? '0–7 días' : d <= 15 ? '8–15 días' : d <= 30 ? '16–30 días' : d <= 60 ? '31–60 días' : d <= 90 ? '61–90 días' : 'Más de 90 días';
const BUCKETS = ['0–7 días', '8–15 días', '16–30 días', '31–60 días', '61–90 días', 'Más de 90 días'];
const V = {};

/* ================== 00 Inicio ================== */
V['inicio/resumen'] = () => {
  const D = S.D, p = P(), I = D.ingresos, pend = D.auts.filter(abierta), cs = D.casos.filter(c => c.est !== EC.CERRADO);
  const prev = D.hist.length > 1 ? D.hist[D.hist.length - 2] : null;
  const al = D.alertas;
  return head('Hola, ' + esc(D.yo.nombre.split(' ')[0]), `${ROL_LBL[D.yo.rol]}${D.yo.areas[0] !== '*' ? ' · ' + esc(D.yo.areas.join(', ')) : ''} · última carga de ingresos: ${fmtDT(D.ultimaCarga)}`) +
  `<div class="sec-title">Lo más importante</div><div class="grid g-kpi mb">
   ${nivel('aut') ? kpi('Autorizaciones pendientes', pend.length, pend.filter(a => horas(a) > p.CRITICO_AUT_HORAS).length + ' críticas · ' + pend.filter(a => a.fuente === 'CODIGO' && a.id.startsWith('D-')).length + ' solo por código', '--crit', 'data-ir="aut/bandeja"') : ''}
   ${nivel('ing') ? kpi('Ingresos abiertos', I.length, 'vs. carga anterior', '--accent', 'data-ir="ing/listado"', null, prev ? { v: I.length - prev.total, good: I.length <= prev.total } : null) : ''}
   ${nivel('ing') ? kpi('Valor abierto', sum(I, x => x.val), 'suma de VALOR', '--accent-2', 'data-ir="ing/conc"', 'm') : ''}
   ${nivel('ing') ? kpi('Hospitalizados', I.filter(x => x.sit === 'HOSPITALIZADO').length, 'cama asignada sin egreso', '--info', 'data-ir="ing/hosp"') : ''}
   ${nivel('ing') ? kpi('Egresados con cama', I.filter(x => x.sit === 'CAMA_NO_LIBERADA').length, 'cama sin liberar', '--crit', `data-ir="ing/listado"`) : ''}
   ${nivel('casos') ? kpi('Casos especiales abiertos', cs.length, cs.filter(c => c.est === EC.SALIO).length + ' salieron sin cierre', '--warn', 'data-ir="casos/salio"') : ''}
  </div>
  <div class="grid g-2"><div class="card"><div class="card-h"><div><h3>Mis alertas</h3><p class="hint">Reglas automáticas según tu rol. “Ver” abre el listado ya filtrado.</p></div>${al.length ? '<button class="btn ghost sm" data-leer="todas">Marcar todas como leídas</button>' : ''}</div>
    <div class="alerts">${al.length ? al.map((a, i) => `<div class="alert ${a.sev} ${S.leidas.has(a.id) ? 'read' : ''}" style="animation-delay:${i * 50}ms"><span class="sev"></span><div><div class="t">${esc(a.t)}</div><div class="d">${esc(a.d)}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn sm" data-ir="${a.mod}/${a.vista}">Ver</button>${S.leidas.has(a.id) ? '' : `<button class="btn ghost sm" data-leer="${a.id}">Leída</button>`}</div></div>`).join('') : '<div class="empty">Sin alertas. Todo al día.</div>'}</div></div>
   <div class="card"><h3>Ingresos abiertos por carga</h3><p class="hint">Una fotografía por día. Pasa el cursor sobre la gráfica para ver cada fecha.</p><div class="chart-box"><canvas id="cIni"></canvas></div></div></div>`;
};
V['inicio/resumen'].after = () => { const H = S.D.hist.slice(-20); if (!H.length) return;
  chart('cIni', { type: 'line', data: { labels: H.map(h => fmtD(h.f)), datasets: [
    { label: 'Total abiertos', data: H.map(h => h.total), borderColor: css('--s1'), backgroundColor: css('--s1') + '22', fill: true, tension: .3 },
    { label: 'Egresados sin cerrar', data: H.map(h => h.eg), borderColor: css('--s2'), tension: .3 },
    { label: 'Hospitalizados', data: H.map(h => h.hosp || null), borderColor: css('--s3'), tension: .3 }] }, options: { interaction: { mode: 'index', intersect: false } } }); };
document.addEventListener('click', e => { const b = e.target.closest('[data-leer]'); if (!b) return; if (b.dataset.leer === 'todas') S.D.alertas.forEach(a => S.leidas.add(a.id)); else S.leidas.add(b.dataset.leer); guardar('leidas', [...S.leidas]); render(false); });

/* ================== 01 Autorizaciones ================== */
const DEF_AUT = () => [
  { k: 'sla', t: 'Tiempo', get: nivelSla, orden: ['Crítica', 'Sobre la meta', 'En tiempo'], grp: 'Estado' },
  { k: 'est', t: 'Estado', get: a => a.est, orden: ['SOLICITADO', 'RADICADO', 'EN TRAMITE', 'AUTORIZADO', 'NEGADO', 'ANULADO'], grp: 'Estado' },
  { k: 'fuente', t: 'Origen', get: a => a.fuente === 'CODIGO' && a.id.startsWith('D-') ? 'Solo código en RESPONSABLE' : 'Registrada', grp: 'Estado' },
  { k: 'erp', t: 'ERP', get: a => a.erp, grp: 'Pagador' },
  { k: 'g', t: 'Área', get: a => a.g, grp: 'Ubicación' },
  { k: 'autz', t: 'Autorizador', get: a => a.autz, grp: 'Responsable' },
  { k: 'pri', t: 'Prioridad', get: a => a.pri, orden: ['ALTA', 'MEDIA', 'BAJA'], grp: 'Responsable' }];
function vAut(scope) {
  if (!nivel('aut')) return sinAcceso();
  let base = S.D.auts;
  if (scope === 'mias') base = base.filter(a => a.autz === S.D.yo.nombre);
  base = scope === 'historico' ? base.filter(a => !abierta(a)) : base.filter(abierta);
  const defs = DEF_AUT().filter(d => scope === 'historico' ? d.k !== 'sla' && d.k !== 'fuente' : d.k !== 'est' || true);
  const rows = aplicarFiltros(base, defs, a => a.pac + a.doc + a.ing + a.id + a.serv + (a.cod || ''));
  const T = { bandeja: ['Bandeja de pendientes', 'Todas las solicitudes abiertas. Las marcadas “Código” vienen de la columna RESPONSABLE del Excel y aún no tienen trámite: ábrelas y tómalas para registrarlas.'], mias: ['Mis trámites', 'Los trámites abiertos asignados a ti.'], historico: ['Histórico de respuestas', 'Trámites autorizados, negados y anulados, con su tiempo total de obtención.'] }[scope];
  const cr = base.filter(a => nivelSla(a) === 'Crítica').length, so = base.filter(a => nivelSla(a) === 'Sobre la meta').length;
  return head(T[0], T[1], nivel('aut') >= 2 ? '<button class="btn" data-ir="aut/nueva">+ Nueva solicitud</button>' : '') + subtabs() +
  (scope !== 'historico' ? `<div class="grid g-kpi mb">${kpi('Abiertas', base.length, 'en esta bandeja', '--accent')}${kpi('Críticas', cr, 'más de ' + P().CRITICO_AUT_HORAS + ' h', '--crit', `data-qf="sla|Crítica"`, null, null, (S.f.sla || []).includes('Crítica'))}${kpi('Sobre la meta', so, 'más de ' + P().META_AUT_HORAS + ' h', '--warn', `data-qf="sla|Sobre la meta"`, null, null, (S.f.sla || []).includes('Sobre la meta'))}${kpi('Solo por código', base.filter(a => a.id.startsWith('D-')).length, 'sin trámite registrado', '--violet', `data-qf="fuente|Solo código en RESPONSABLE"`)}</div>` : '') +
  barraFiltros(S.vista, base, defs, 'Buscar paciente, documento, ingreso, trámite o servicio') +
  table('aut-' + scope, [
    { h: 'Trámite', v: a => `<span class="mono">${esc(a.id)}</span><br>${fuentePill(a)}`, s: a => a.id },
    { h: 'Paciente', v: a => `${esc(a.pac)}<br><span class="mono muted">${esc(a.doc)} · ing ${esc(a.ing)}</span>`, s: a => a.pac },
    { h: 'Servicio', v: a => esc(a.serv || '—'), s: a => a.serv },
    { h: 'ERP', v: a => esc(a.erp), s: a => a.erp },
    { h: 'Área', v: a => esc(a.g) + (a.ala ? `<br><small class="muted">${esc(a.ala)}</small>` : ''), s: a => a.g },
    { h: 'Estado', v: a => estPill(a.est), s: a => a.est },
    { h: 'Tiempo', v: slaPill, s: horas },
    { h: 'Autorizador', v: a => esc(a.autz), s: a => a.autz }], rows, abrirAut);
}
V['aut/bandeja'] = () => vAut('bandeja'); V['aut/mias'] = () => vAut('mias'); V['aut/historico'] = () => vAut('historico');
document.addEventListener('click', e => { const b = e.target.closest('[data-qf]'); if (!b) return; const [k, v] = b.dataset.qf.split('|'); const cur = S.f[k] || []; S.f[k] = cur.length === 1 && cur[0] === v ? [] : [v]; S.page = {}; render(false); });

async function abrirAut(a) {
  const i = EA_PASOS.indexOf(a.est), esAdmin = S.D.yo.rol === 'ADMINISTRADOR';
  const puedeGestionar = nivel('aut') >= 2 && (esAdmin || a.autz === S.D.yo.nombre || a.autz === 'Sin asignar' || !a.autz);
  const detectada = a.id.startsWith('D-');
  const cuerpo = (bit) => `
   ${detectada ? `<div class="alert warn"><span class="sev"></span><div><div class="t">Pendiente detectada solo por código</div><div class="d">El Excel trae “${esc(a.cod)}” en RESPONSABLE pero no hay trámite. Regístralo con el servicio para que entre a la medición.</div></div><span></span></div>` : ''}
   <div class="steps">${EA_PASOS.map((s, k) => `<div class="step ${a.est === 'NEGADO' || a.est === 'ANULADO' ? '' : k < i ? 'done' : k === i ? 'cur' : ''}">${s}</div>`).join('')}${a.est === 'NEGADO' || a.est === 'ANULADO' ? `<div class="step neg">${a.est}</div>` : ''}</div>
   <div class="kv"><div><small>Paciente</small><span>${esc(a.pac)}</span></div><div><small>Documento</small><span class="mono">${esc(a.doc)}</span></div><div><small>Ingreso</small><span class="mono">${esc(a.ing)}</span></div>
   <div><small>Área</small><span>${esc(a.g)}${a.ala ? ' · ' + esc(a.ala) : ''}</span></div><div><small>ERP</small><span>${esc(a.erp)}</span></div><div><small>Solicitada</small><span>${fmtDT(a.fs)}</span></div>
   <div><small>Tiempo</small><span>${slaPill(a)}</span></div><div><small>Autorizador</small><span>${esc(a.autz)}</span></div>${a.rad ? `<div><small>Radicado</small><span class="mono">${esc(a.rad)}</span></div>` : ''}${a.num ? `<div><small>N° autorización</small><span class="mono">${esc(a.num)}</span></div>` : ''}${a.cups ? `<div><small>CUPS</small><span class="mono">${esc(a.cups)}</span></div>` : ''}</div>
   ${a.mot ? `<div class="card" style="background:var(--surface-2)"><small class="crumb">Motivo de negación</small><div>${esc(a.mot)}</div></div>` : ''}
   ${!detectada ? `<div><h3 style="font-size:14px;margin-bottom:8px">Bitácora</h3>${bit === null ? '<p class="muted">Cargando…</p>' : bit.length ? `<ol class="timeline">${bit.map(h => `<li><div>${esc(h.t)}</div><small>${fmtDT(h.f)} · ${esc(h.u)}</small></li>`).join('')}</ol>` : '<p class="muted">Sin movimientos.</p>'}</div>` : ''}
   ${puedeGestionar ? (detectada ? `<button class="btn" data-tomar="${esc(a.ing)}|${esc(a.cod)}">Registrar trámite para este ingreso</button>` : formAccionesAut(a, esAdmin)) : `<p class="muted">${abierta(a) ? 'Solo lectura: este trámite lo gestiona ' + esc(a.autz) + '.' : 'Trámite cerrado.'}</p>`}`;
  drawer(esc(a.serv || 'Autorización pendiente'), esc(a.id) + ' · ' + esc(a.erp), cuerpo(detectada ? [] : null));
  if (!detectada) try { const bit = await API.call('bitacoraAut', { id: a.id }); if ($('.drawer')) { $('.dr-b').innerHTML = cuerpo(bit); } } catch (e) { fallo(e); }
}
function formAccionesAut(a, esAdmin) {
  const cerrada = !abierta(a);
  if (cerrada && !esAdmin) return '<p class="muted">Trámite cerrado.</p>';
  const ops = [['nota', 'Agregar nota']];
  if (!cerrada || esAdmin) { if (a.est === 'SOLICITADO' || esAdmin) ops.unshift(['radicar', 'Radicar ante la EPS']); ops.unshift(['autorizar', 'Registrar autorización']); ops.push(['tramite', 'Marcar en trámite'], ['negar', 'Registrar negación'], ['anular', 'Anular']); }
  if (esAdmin) ops.push(['asignar', 'Reasignar autorizador']);
  return `<form id="fAccAut" class="card grid" data-id="${esc(a.id)}"><h3>${cerrada ? 'Corregir trámite cerrado (administrador)' : 'Registrar gestión'}</h3>
    <div class="field"><label for="aAcc">Acción</label><select class="inp" id="aAcc">${ops.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>
    <div class="form-grid"><div class="field" id="aNumF"><label for="aNum">Número</label><input class="inp" id="aNum" placeholder="Radicado o N° de autorización"></div>
    <div class="field"><label for="aFec">Fecha (si no es ahora)</label><input class="inp" id="aFec" type="datetime-local"></div></div>
    <div class="field" id="aAutF" hidden><label for="aAut">Autorizador</label><select class="inp" id="aAut">${S.D.autorizadores.map(n => `<option>${esc(n)}</option>`).join('')}</select></div>
    <div class="field"><label for="aObs">Observación ${cerrada ? '(motivo obligatorio)' : ''}</label><textarea class="inp" id="aObs" placeholder="Ej.: se llamó a la EPS, responden en 24 h"></textarea></div>
    <button class="btn" type="submit">Guardar</button></form>`;
}
document.addEventListener('change', e => { if (e.target.id === 'aAcc') { const v = e.target.value; $('#aNumF').hidden = !['radicar', 'autorizar'].includes(v); $('#aAutF').hidden = v !== 'asignar'; } });
document.addEventListener('submit', async e => {
  if (e.target.id === 'fAccAut') { e.preventDefault(); const id = e.target.dataset.id, acc = $('#aAcc').value;
    const d = { id, accion: acc, observacion: $('#aObs').value, fecha: $('#aFec').value || null, autorizador: $('#aAut').value };
    if (acc === 'radicar') d.numRadicado = $('#aNum').value; if (acc === 'autorizar') d.numAutorizacion = $('#aNum').value;
    try { await API.call('accionAut', d); toast('Gestión registrada en ' + id); cerrarCapa(); await cargarDatos(); } catch (x) { fallo(x); } }
  if (e.target.id === 'fNueva') { e.preventDefault(); const d = { ingreso: $('#nIng').dataset.v, servicio: $('#nServ').value, cups: $('#nServ').dataset.v || '', tipoServicio: $('#nTipo').value, prioridad: $('#nPri').value, observacion: $('#nObs').value, codigo: e.target.dataset.cod || '', fechaSolicitud: $('#nFec').value || null };
    if (!d.ingreso) { toast('Elige el ingreso de la lista de sugerencias.', 'error'); return; }
    try { const r = await API.call('crearAut', d); toast('Solicitud ' + r.id + ' registrada.'); cerrarCapa(); await cargarDatos(); } catch (x) { fallo(x); } }
});
document.addEventListener('click', e => { const b = e.target.closest('[data-tomar]'); if (!b) return; const [ing, cod] = b.dataset.tomar.split('|'); formNuevaAut(ing, cod); });
function formNuevaAut(ing, cod) {
  if (nivel('aut') < 2) { toast('Tu rol no registra solicitudes.', 'error'); return; }
  const x = ing ? S.D.ingresos.find(z => z.i === ing) : null;
  drawer('Nueva solicitud de autorización', 'Operación › Autorizaciones', `<form id="fNueva" class="grid" data-cod="${esc(cod || '')}">
    <div class="field"><label for="nIng">Ingreso o paciente</label><input class="inp" id="nIng" placeholder="Escribe documento, nombre o número de ingreso" autocomplete="off" ${x ? `value="${esc(x.i + ' · ' + x.pac + ' · ' + x.doc)}" data-v="${esc(x.i)}"` : ''}></div>
    <div id="nInfo" class="muted" style="font-size:12.5px">${x ? esc(x.g + ' · ' + x.erp + ' · ' + x.con) : ''}</div>
    <div class="field"><label for="nServ">Servicio (CUPS o descripción)</label><input class="inp" id="nServ" placeholder="Escribe al menos 3 letras o el código CUPS" autocomplete="off"></div>
    <div class="form-grid"><div class="field"><label for="nTipo">Tipo de servicio</label><select class="inp" id="nTipo">${['Procedimiento', 'Imagen diagnóstica', 'Laboratorio', 'Interconsulta', 'Medicamento', 'Estancia', 'Remisión', 'Insumo', 'Otro'].map(t => `<option>${t}</option>`).join('')}</select></div>
    <div class="field"><label for="nPri">Prioridad</label><select class="inp" id="nPri"><option>ALTA</option><option selected>MEDIA</option><option>BAJA</option></select></div>
    <div class="field"><label for="nFec">Fecha de solicitud</label><input class="inp" id="nFec" type="datetime-local"></div></div>
    <div class="field"><label for="nObs">Observación</label><textarea class="inp" id="nObs"></textarea></div>
    ${cod ? `<p class="muted" style="margin:0">Se registra a partir del código <b>${esc(cod)}</b> de la columna RESPONSABLE.</p>` : ''}
    <button class="btn" type="submit">Registrar solicitud</button></form>`);
  autocompletar('nIng', async v => { const t = v.toUpperCase(); return S.D.ingresos.filter(z => (z.i + ' ' + z.doc + ' ' + z.pac).toUpperCase().includes(t)).slice(0, 15).map(z => ({ v: z.i, l: z.i + ' · ' + z.pac + ' · ' + z.doc, x: z })); },
    o => { $('#nIng').dataset.v = o.v; $('#nInfo').textContent = o.x.g + ' · ' + o.x.erp + ' · ' + o.x.con; });
  autocompletar('nServ', v => API.call('buscarCups', { q: v }), o => { $('#nServ').dataset.v = o.v; });
}

/* ================== 02 Ingresos abiertos ================== */
const DEF_ING = () => [
  { k: 'sit', t: 'Situación', get: x => x.sit, lbl: v => SIT_LBL[v] || v, orden: SITS, grp: 'Estado' },
  { k: 'g', t: 'Área de ingreso', get: x => x.g, grp: 'Ubicación' },
  { k: 'ala', t: 'Ala / pabellón', get: x => x.ala || '(sin ala)', grp: 'Ubicación' },
  { k: 'erp', t: 'ERP', get: x => x.erp, grp: 'Pagador' },
  { k: 'con', t: 'Contrato', get: x => x.erp + ' › ' + x.con, lbl: v => v.split(' › ')[1], grupo: v => v.split(' › ')[0], grp: 'Pagador' },
  { k: 'ban', t: 'Tipo de pagador', get: x => x.ban, lbl: v => BAN_LBL[v] || v, grp: 'Pagador' },
  { k: 'por', t: 'Ingreso por', get: x => x.por || '(vacío)', grp: 'Origen' },
  { k: 'u', t: 'Usuario de ingreso', get: x => x.u || '(vacío)', grp: 'Origen' },
  { k: 'ap', t: 'Autorización', get: x => x.ap ? 'Con pendientes' : 'Sin pendientes', grp: 'Control' },
  { k: 'dias', t: 'Días abierto', get: x => bucketDias(x.d), orden: BUCKETS, grp: 'Control' },
  { k: 'h', t: 'Hallazgo', get: x => x.h || [], grp: 'Control' }];
const buscaIng = x => x.pac + ' ' + x.doc + ' ' + x.i + ' ' + x.cama + ' ' + x.obs + ' ' + x.resp;
const colsIng = () => [
  { h: 'Ingreso', v: x => `<span class="mono">${esc(x.i)}</span><br><small class="muted">${fmtD(x.f)} · ${esc((x.tipo || '').toLowerCase())}</small>`, s: x => x.i },
  { h: 'Paciente', v: x => `${esc(x.pac)}<br><span class="mono muted">${esc(x.tid)} ${esc(x.doc)} · ${x.edad} a</span>`, s: x => x.pac },
  { h: 'Área · ala · cama', v: x => `${esc(x.g)}${x.inf ? ' <span class="pill p-mut" title="El Excel trae AREA vacía; se tomó de INGRESO POR">inferida</span>' : ''}${x.ala ? `<br><small>${esc(x.ala)}</small>` : ''}${x.cama ? `<br><span class="mono">${esc(x.cama)}</span>` : ''}`, s: x => x.g },
  { h: 'Situación', v: x => sitPill(x.sit), s: x => x.sit },
  { h: 'ERP · contrato', v: x => `${esc(x.erp)}<br><small class="muted">${esc(x.con)}</small>`, s: x => x.erp },
  { h: 'Días', cl: 'r', v: x => { const l = x.sit === 'CE' ? P().CE_DIAS_CIERRE : P().PROLONGADO_DIAS; return `<span class="pill ${x.d > l ? 'p-crit' : x.d > l / 2 ? 'p-warn' : 'p-mut'} num">${x.d}</span>`; }, s: x => x.d },
  { h: 'Aut. pend.', cl: 'r', v: x => x.ap ? `<span class="pill p-crit">${x.ap}</span>` : '<span class="pill p-ok">0</span>', s: x => x.ap },
  { h: 'Valor', cl: 'r', v: x => `<span class="num">${money(x.val)}</span>`, s: x => x.val },

async function leerExcel(file) {
  if (!file) return; S.resCarga = ''; const out = $('#valid');
  if (!/\.(xlsx|xls|csv)$/i.test(file.name)) { out.innerHTML = '<div class="alert crit"><span class="sev"></span><div><div class="t">Formato no válido</div><div class="d">Sube un .xlsx, .xls o .csv.</div></div><span></span></div>'; return; }
  if (typeof XLSX === 'undefined') { fallo(new Error('No se pudo cargar el lector de Excel. Revisa la conexión a internet.')); return; }
  out.innerHTML = '<p class="muted">Leyendo archivo…</p>';
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const sh = wb.Sheets[wb.SheetNames[0]], m = XLSX.utils.sheet_to_json(sh, { header: 1, defval: '', raw: true });
    const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
    const hi = m.findIndex(r => r.map(norm).includes('INGRESO') && r.map(norm).includes('ENTIDAD'));
    if (hi < 0) throw new Error('No encontré la fila de encabezados (debe tener INGRESO y ENTIDAD).');
    const enc = m[hi].map(String);
    const filas = m.slice(hi + 1).filter(r => r.some(c => c !== '')).map(r => { const o = {}; enc.forEach((h, i) => { if (h) { const v = r[i]; o[h] = v instanceof Date ? v.toISOString() : v; } }); return o; });
    out.innerHTML = `<div class="alert info"><span class="sev"></span><div><div class="t">${esc(file.name)}: ${fmtN(filas.length)} filas</div><div class="d">Encabezados encontrados en la fila ${hi + 1}. Confirma para reemplazar la carga actual.</div></div><button class="btn sm" id="bConf">Cargar</button></div>`;
    $('#bConf').onclick = async () => { $('#bConf').disabled = true; out.insertAdjacentHTML('beforeend', '<p class="muted">Procesando en el servidor… puede tardar hasta un minuto.</p>');
      try { const r = await API.call('cargarIngresos', { nombreArchivo: file.name, filas });
        S.resCarga = out.innerHTML = `<div class="alert info"><span class="sev"></span><div><div class="t">Carga terminada: ${fmtN(r.filas)} ingresos${r.reemplazoDelDia ? ' (reemplazó la fotografía de hoy)' : ''}</div><div class="d">${r.primeraCarga ? 'Primera carga: los cambios aparecen desde la siguiente.' : `Nuevos ${fmtN(r.nuevos)} · salieron ${fmtN(r.salieron)} · cambio de pagador ${fmtN(r.cambioPagador)}`} · casos creados ${fmtN(r.casosCreados)} · casos que salieron sin cierre ${fmtN(r.casosSalieron)}${r.duplicados ? ' · ' + r.duplicados + ' filas repetidas omitidas' : ''}.</div></div><span></span></div>`;
        await cargarDatos(); } catch (x) { fallo(x); $('#bConf') && ($('#bConf').disabled = false); } };
  } catch (x) { out.innerHTML = ''; fallo(x); }
}

document.addEventListener('click', e => { const c = e.target.closest('[data-copiar]'); if (c) navigator.clipboard.writeText(c.dataset.copiar).then(() => toast('Copiada.'), () => toast('Selecciónala y cópiala manualmente.', 'error')); });
V['admin/permisos'] = vistaAdmin(A => { const MOD_LBL = { inicio: 'Inicio', aut: '01 Autorizaciones', ing: '02 Ingresos abiertos', casos: '03 Casos especiales', med: '04 Medición y 05 Informes', carga: '06 Cargue de datos', admin: '07 Administración' };
  return head('Permisos por rol', 'Sin acceso · Consulta (ver) · Gestión (registrar y modificar). El cambio aplica en la siguiente acción de cada usuario.') + subtabs() +
  `<div class="tbl-wrap"><table><thead><tr><th>Módulo</th>${A.roles.map(r => `<th>${ROL_LBL[r]}</th>`).join('')}</tr></thead><tbody>${A.modulos.filter(m => m !== 'inicio').map(m => `<tr><td><b>${MOD_LBL[m]}</b></td>${A.roles.map(r => `<td><select data-perm="${m}|${r}" aria-label="${MOD_LBL[m]} para ${ROL_LBL[r]}" ${m === 'admin' && r === 'ADMINISTRADOR' ? 'disabled' : ''} style="padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--surface)">${['Sin acceso', 'Consulta', 'Gestión'].map((l, i) => `<option value="${i}" ${A.permisos[m][r] === i ? 'selected' : ''}>${l}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div>`; });
document.addEventListener('change', async e => { const p = e.target.closest('[data-perm]'); if (!p) return; const [modulo, rol] = p.dataset.perm.split('|');
  try { await API.call('guardarPermiso', { modulo, rol, nivel: +p.value }); toast('Permiso actualizado.'); S.adm.permisos[modulo][rol] = +p.value; } catch (x) { fallo(x); } });
V['admin/parametros'] = vistaAdmin(A => head('Parámetros', 'Metas, plazos y umbrales de las alertas. Al cambiar una regla numérica se crea una nueva versión de reglas, para no mezclar series históricas.') + subtabs() +
  `<div class="card"><div class="grid g-3">${A.parametros.map(p => `<label class="field"><span style="font-weight:600">${esc(p.desc)}</span><input class="inp" data-param="${p.clave}" value="${esc(p.valor)}" ${p.clave === 'REGLA_VERSION' ? 'readonly' : ''}></label>`).join('')}</div></div>`);
document.addEventListener('change', async e => { const p = e.target.closest('[data-param]'); if (!p) return; try { await API.call('guardarParametro', { clave: p.dataset.param, valor: p.value }); toast('Parámetro guardado. Las alertas se recalculan.'); S.adm = null; await cargarDatos(); } catch (x) { fallo(x); } });
V['admin/catalogos'] = vistaAdmin(A => { const cat = S.opc.cat || 'erp', T = A[cat];
  const ix = n => T.enc.indexOf(n);
  let filas = T.filas.map(r => { const o = {}; T.enc.forEach((h, i) => { o[h] = r[i]; }); return o; });
  if (cat !== 'codigos') filas.sort((a, b) => (String(a.REVISADO) === 'SI') - (String(b.REVISADO) === 'SI') || (+b['INGRESOS ULTIMA CARGA'] || 0) - (+a['INGRESOS ULTIMA CARGA'] || 0));
  const filtro = (S.f.catq || '').toUpperCase(); if (filtro) filas = filas.filter(o => JSON.stringify(o).toUpperCase().includes(filtro));
  const editables = { erp: ['ERP', 'CONTRATO', 'BANDEJA'], areas: ['GRUPO', 'ALA'], codigos: ['PATRON', 'CLAVE', 'SIGNIFICADO', 'ACTIVO'] }[cat];
  const clave = cat === 'codigos' ? 'PATRON' : 'TEXTO ORIGINAL';
  return head('Catálogos', 'Corrige aquí cómo se agrupan los textos del Excel. Las filas sin revisar aparecen primero; al guardar quedan marcadas como revisadas y la siguiente carga respeta tu corrección.') + subtabs() +
  `<div class="chips">${[['erp', 'ERP › contrato'], ['areas', 'Áreas › ala'], ['codigos', 'Códigos de RESPONSABLE']].map(z => `<button class="chip ${cat === z[0] ? 'on' : ''}" data-opc="cat|${z[0]}">${z[1]}</button>`).join('')}</div>
  <div class="fbar"><label class="search"><input type="search" data-fs="catq" value="${esc(S.f.catq || '')}" placeholder="Buscar en el catálogo" aria-label="Buscar en el catálogo"></label>${cat === 'codigos' ? '<button class="btn ghost sm" id="bNuevoCod">+ Nuevo código</button>' : ''}</div>
  <form id="fCat" data-cat="${cat}"><div class="tbl-wrap"><table><thead><tr>${T.enc.filter(Boolean).map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>
  ${filas.slice(0, 300).map(o => `<tr data-k="${esc(o[clave])}">${T.enc.filter(Boolean).map(h => editables.includes(h) ? `<td>${h === 'BANDEJA' ? `<select class="inp" data-cf="${h}" style="min-width:150px">${Object.keys(BAN_LBL).map(b => `<option value="${b}" ${o[h] === b ? 'selected' : ''}>${BAN_LBL[b]}</option>`).join('')}</select>` : `<input class="inp" data-cf="${h}" value="${esc(o[h])}" style="min-width:${h === 'PATRON' ? 260 : 140}px">`}</td>` : `<td class="${h === 'TEXTO ORIGINAL' ? 'mono' : ''}" style="font-size:12px;max-width:340px">${h === 'REVISADO' ? (o[h] === 'SI' ? '<span class="pill p-ok">Sí</span>' : '<span class="pill p-warn">No</span>') : esc(o[h])}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div><div class="mt" style="display:flex;gap:8px;align-items:center"><button class="btn" type="submit">Guardar cambios</button><span class="muted" id="catN">Solo se guardan las filas que modificaste.</span></div></form>`; });
document.addEventListener('input', e => { const i = e.target.closest('[data-cf]'); if (i) i.closest('tr').dataset.mod = '1'; });
document.addEventListener('change', e => { const i = e.target.closest('[data-cf]'); if (i) i.closest('tr').dataset.mod = '1'; });
document.addEventListener('click', e => { if (e.target.id !== 'bNuevoCod') return; const tb = $('#fCat tbody'); const enc = S.adm.codigos.enc.filter(Boolean);
  tb.insertAdjacentHTML('afterbegin', `<tr data-k="" data-mod="1">${enc.map(h => `<td><input class="inp" data-cf="${h}" value="${h === 'ACTIVO' ? 'SI' : ''}" style="min-width:${h === 'PATRON' ? 260 : 140}px"></td>`).join('')}</tr>`); });
document.addEventListener('submit', async e => { if (e.target.id !== 'fCat') return; e.preventDefault(); const cat = e.target.dataset.cat;
  const cambios = [...e.target.querySelectorAll('tr[data-mod="1"]')].map(tr => { const o = { _clave: tr.dataset.k }; tr.querySelectorAll('[data-cf]').forEach(i => { o[i.dataset.cf] = i.value; }); if (cat !== 'codigos') o['TEXTO ORIGINAL'] = tr.dataset.k; return o; });
  if (!cambios.length) { toast('No modificaste ninguna fila.'); return; }
  try { await API.call('guardarCatalogo', { catalogo: cat, cambios }); toast(cambios.length + ' filas guardadas. Se aplican desde ya.'); S.adm = await API.call('adminDatos'); await cargarDatos(); } catch (x) { fallo(x); } });
</script>
