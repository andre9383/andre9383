<style>
/* Layout: barra superior con módulos agrupados (Operación · Análisis · Configuración), menú desplegable por secciones,
   lienzo de trabajo y panel lateral de detalle. Interfaz en teal; gráficos con paleta categórica validada; rojo/ámbar/verde solo para estados. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f6; --line:#dde3ec;
  --fg:#16202e; --muted:#5d6a7e; --ink:#0d2b45; --ink-2:#123a5c; --ink-fg:#e8f0f8;
  --accent:#0b7a75; --accent-2:#2563eb; --accent-soft:#d8f0ee;
  --ok:#15803d; --ok-soft:#dcf3e3; --warn:#a15c07; --warn-soft:#fdeccf;
  --crit:#c2261d; --crit-soft:#fbe0de; --info:#2563eb; --info-soft:#dfe9fd;
  --violet:#6250d6; --violet-soft:#ece3fd;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --st-good:#0ca30c; --st-warn:#fab219; --st-crit:#d03b3b;
  --q1:#86b6ef; --q2:#5598e7; --q3:#2a78d6; --q4:#1c5cab; --q5:#104281; --q6:#0d366b;
  --shadow:0 1px 2px rgba(13,43,69,.06),0 8px 24px rgba(13,43,69,.08);
  --f-display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1420; --surface:#121d2c; --surface-2:#182638; --line:#24354b;
  --fg:#e3eaf3; --muted:#93a3b8; --ink:#08111c; --ink-2:#0f2236; --ink-fg:#dbe7f3;
  --accent:#2bb5ad; --accent-2:#6b9bff; --accent-soft:#123b3c;
  --ok:#4ade80; --ok-soft:#123222; --warn:#f5b041; --warn-soft:#3a2a10;
  --crit:#ff6b60; --crit-soft:#3d1715; --info:#7aa7ff; --info-soft:#14264a;
  --violet:#9085e9; --violet-soft:#291b48;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --q1:#184f95; --q2:#1c5cab; --q3:#256abf; --q4:#3987e5; --q5:#6da7ec; --q6:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
[hidden]{display:none!important}
.splash{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:10px;color:var(--muted)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#19b3a9,#2563eb);display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800;font-family:var(--f-display)}

/* ---------- Acceso ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.auth-side{background:radial-gradient(1200px 500px at 20% 10%,#174b73 0,transparent 60%),var(--ink);color:var(--ink-fg);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.auth-side h1{font-size:34px;line-height:1.15;max-width:16ch}
.auth-side ul{padding-left:18px;margin:0;display:grid;gap:8px;color:#b9cde0;max-width:46ch}
.auth-main{display:grid;place-items:center;padding:32px 16px}
.auth-card{width:min(420px,100%);display:grid;gap:14px}
.auth-card h2{font-size:22px}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:76px;resize:vertical}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.err{color:var(--crit);font-size:13px;min-height:1em}
.ok-msg{color:var(--ok);font-size:13px}
@media (max-width:820px){.auth{grid-template-columns:1fr}.auth-side{padding:28px 20px}.auth-side h1{font-size:24px}.auth-side ul{display:none}}

/* ---------- Barra superior y menú ---------- */
.top{position:sticky;top:0;z-index:50;background:var(--ink);color:var(--ink-fg)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:16px;white-space:nowrap}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--ink-fg);border-radius:8px;padding:6px 10px;cursor:pointer;position:relative;display:inline-flex;gap:6px;align-items:center}
.tb:hover{background:rgba(255,255,255,.14)}
.tb .dot{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;border-radius:10px;background:#ef4444;color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.tb .dot.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}70%{box-shadow:0 0 0 9px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.who{font-size:12.5px;line-height:1.2;text-align:right}
.who small{display:block;color:#93acc4}
.nav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;padding:0 16px;border-top:1px solid rgba(255,255,255,.08)}
.nav::-webkit-scrollbar{display:none}
.nav-grp{display:flex;align-items:stretch;gap:0;padding-right:6px;margin-right:6px;border-right:1px solid rgba(255,255,255,.08)}
.nav-grp:last-child{border-right:0}
.nav-grp-lbl{align-self:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6f8aa6;padding:0 6px 0 2px;white-space:nowrap}
.nav-btn{background:none;border:0;color:#a9bdd2;padding:11px 9px;cursor:pointer;white-space:nowrap;font-weight:500;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center}
.nav-btn:hover,.nav-btn[aria-expanded="true"]{color:#fff}
.nav-btn.on{color:#fff;border-bottom-color:#19b3a9}
.nav-btn .n{font-family:var(--f-mono);font-size:11px;opacity:.55}
.nav-btn .chev{font-size:10px;opacity:.6;transition:transform .15s}
.nav-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cnt{background:#ef4444;color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:600;line-height:17px}
.cnt.soft{background:rgba(255,255,255,.16)}

.mega{position:fixed;z-index:70;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:6px;animation:dd .16s ease-out;max-width:calc(100vw - 16px)}
@keyframes dd{from{transform:translateY(-4px);opacity:.3}to{transform:none;opacity:1}}
.mega-sec{display:grid;align-content:start;gap:2px;padding:4px}
.mega-sec h4{margin:2px 8px 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mega-it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;width:100%}
.mega-it:hover,.mega-it:focus-visible,.mega-it.on{background:var(--surface-2)}
.mega-it.on b{color:var(--accent)}
.mega-it b{font-weight:600;font-size:13.5px}
.mega-it small{grid-column:1/-1;color:var(--muted);font-size:12px;line-height:1.35}
.mega-it .pill{justify-self:end}
@media (max-width:700px){.mega{grid-auto-flow:row;left:8px!important;right:8px;max-height:70vh;overflow:auto}}

/* ---------- Lienzo ---------- */
main{padding:20px 16px 60px;max-width:1440px;margin:0 auto}
.loadbar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#19b3a9,#2563eb);z-index:200;width:0;transition:width .3s}
.loadbar.on{width:70%;transition:width 8s cubic-bezier(.1,.6,.2,1)}
.view{animation:vin .26s ease-out}
@keyframes vin{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:24px}
.crumb{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.crumb b{color:var(--accent);font-weight:600}
.sub{color:var(--muted);max-width:80ch;margin:4px 0 0}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;background:var(--surface-2);padding:4px;border-radius:10px;width:fit-content;max-width:100%}
.tab{background:none;border:0;padding:7px 13px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tab.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tab .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:15px;margin-bottom:2px}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sec-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
button.kpi{cursor:pointer}
button.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--muted)}
.kpi .delta{font-size:12px;font-weight:600}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--accent))}
.kpi.sel{outline:2px solid var(--accent)}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:210px}.chart-box.lg{height:320px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* ---------- Barra de filtros y listas desplegables ---------- */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.fbar .search{flex:1 1 240px;position:relative}
.fbar .search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 32px;background:var(--surface-2)}
.fbar .search::before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-60%)}
.fbar .search::after{content:"";position:absolute;left:21px;top:58%;width:6px;height:2px;background:var(--muted);transform:rotate(45deg)}
.cb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;max-width:240px;white-space:nowrap}
.cb:hover{border-color:var(--accent)}
.cb .lbl{color:var(--muted);font-size:12.5px}
.cb .v{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.cb .chev{font-size:10px;color:var(--muted)}
.cb.act{border-color:var(--accent);background:var(--accent-soft)}
.cb.act .lbl{color:var(--accent)}
.fbar .grp-sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.cbp{position:fixed;z-index:120;width:min(320px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:min(440px,70vh);animation:dd .14s ease-out}
.cbp-h{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.cbp-h input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--surface-2)}
.cbp-h .row{display:flex;justify-content:space-between;font-size:12px}
.cbp-h .row button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.cbp-l{overflow:auto;padding:6px}
.cbp-o{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.cbp-o:hover,.cbp-o.kb{background:var(--surface-2)}
.cbp-o .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.cbp-o.zero{opacity:.45}
.cbp-o input{accent-color:var(--accent)}
.cbp-grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 8px 2px}
.cbp-f{border-top:1px solid var(--line);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:12.5px;display:flex;gap:6px;align-items:center;transition:background .15s}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on b{color:#9fd9d4}
.active-f{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.active-f span{font-size:12px;color:var(--muted)}
.active-f button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;font-weight:600}
.ac{position:relative}
.ac-l{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:130;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:260px;overflow:auto;padding:4px}
.ac-o{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.ac-o:hover,.ac-o.kb{background:var(--surface-2)}

/* ---------- Tablas ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.row{cursor:pointer;transition:background .12s}
tr.row:hover td{background:var(--surface-2)}
tr.sub td{background:var(--surface-2);font-weight:600}
td.obs{max-width:280px;color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}.p-info{background:var(--info-soft);color:var(--info)}
.p-vio{background:var(--violet-soft);color:var(--violet)}.p-mut{background:var(--surface-2);color:var(--muted)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:12.5px;color:var(--muted);gap:8px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;transition:filter .15s;display:inline-flex;gap:6px;align-items:center}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--crit)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:28px;text-align:center;color:var(--muted)}
.dotl{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}

/* ---------- Alertas, panel, varios ---------- */
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);animation:vin .3s ease-out both}
.alert .sev{width:9px;height:9px;border-radius:50%;margin-top:6px}
.alert.crit .sev{background:var(--crit);box-shadow:0 0 0 4px var(--crit-soft)}
.alert.warn .sev{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.alert.info .sev{background:var(--info);box-shadow:0 0 0 4px var(--info-soft)}
.alert .t{font-weight:600}
.alert .d{color:var(--muted);font-size:12.5px}
.alert.read{opacity:.55}
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.45);z-index:80;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:90;box-shadow:-10px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
.dr-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dr-h h2{font-size:18px}
.dr-b{padding:16px 18px;overflow-y:auto;flex:1;display:grid;gap:16px;align-content:start}
.x{margin-left:auto;background:var(--surface-2);border:0;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kv span{overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.timeline li:last-child{border-left-color:transparent}
.timeline li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.timeline small{color:var(--muted)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{flex:1 1 80px;text-align:center;font-size:11px;padding:6px 4px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-weight:600}
.step.done{background:var(--accent-soft);color:var(--accent)}
.step.cur{background:var(--accent);color:#fff}
.step.neg{background:var(--crit);color:#fff}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--s1);border-radius:5px;transition:width .5s}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:grid;gap:8px;max-width:min(400px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;padding:11px 14px;border-radius:9px;box-shadow:var(--shadow);animation:slide .25s ease-out;font-size:13px}
.toast.error{background:var(--crit);cursor:pointer}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.flow .node{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--surface);text-align:center;cursor:pointer;transition:transform .15s}
.flow .node:hover{transform:translateY(-2px)}
.flow .node.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.flow .node b{display:block;font-family:var(--f-display);font-size:22px}
.flow .node small{color:var(--muted);font-size:11.5px}
.drop-zone{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);transition:border-color .2s,background .2s}
.drop-zone.over{border-color:var(--accent);background:var(--accent-soft)}
.lock{padding:40px;text-align:center}
.lock h2{font-size:20px;margin-bottom:6px}
.ia-out{white-space:pre-wrap;background:var(--surface-2);border-radius:9px;padding:14px;line-height:1.6}
