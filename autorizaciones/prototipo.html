<title>Centro de Autorizaciones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: barra superior con módulos en cascada + lienzo de trabajo; panel lateral deslizable para el detalle de cada caso. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f6; --line:#dde3ec;
  --fg:#16202e; --muted:#5d6a7e; --ink:#0d2b45; --ink-fg:#e8f0f8;
  --accent:#0b7a75; --accent-2:#2563eb; --accent-soft:#d8f0ee;
  --ok:#15803d; --ok-soft:#dcf3e3; --warn:#b45309; --warn-soft:#fdeccf;
  --crit:#c2261d; --crit-soft:#fbe0de; --info:#2563eb; --info-soft:#dfe9fd;
  --violet:#7c3aed; --violet-soft:#ece3fd;
  --shadow:0 1px 2px rgba(13,43,69,.06),0 6px 18px rgba(13,43,69,.06);
  --f-display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1420; --surface:#121d2c; --surface-2:#182638; --line:#24354b;
  --fg:#e3eaf3; --muted:#93a3b8; --ink:#08111c; --ink-fg:#dbe7f3;
  --accent:#2bb5ad; --accent-2:#6b9bff; --accent-soft:#123b3c;
  --ok:#4ade80; --ok-soft:#123222; --warn:#f5b041; --warn-soft:#3a2a10;
  --crit:#ff6b60; --crit-soft:#3d1715; --info:#7aa7ff; --info-soft:#14264a;
  --violet:#b18cff; --violet-soft:#291b48;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1420; --surface:#121d2c; --surface-2:#182638; --line:#24354b;
  --fg:#e3eaf3; --muted:#93a3b8; --ink:#08111c; --ink-fg:#dbe7f3;
  --accent:#2bb5ad; --accent-2:#6b9bff; --accent-soft:#123b3c;
  --ok:#4ade80; --ok-soft:#123222; --warn:#f5b041; --warn-soft:#3a2a10;
  --crit:#ff6b60; --crit-soft:#3d1715; --info:#7aa7ff; --info-soft:#14264a;
  --violet:#b18cff; --violet-soft:#291b48;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

/* ---------- Barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--ink-fg)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:16px;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#19b3a9,#2563eb);display:grid;place-items:center;font-size:13px;color:#fff}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px}
.who select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--ink-fg);border-radius:8px;padding:5px 8px;max-width:220px}
.who select option{color:#16202e;background:#fff}
.bell{position:relative;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--ink-fg);border-radius:8px;padding:5px 10px;cursor:pointer}
.bell .dot{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:#ef4444;color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.bell .dot.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}70%{box-shadow:0 0 0 9px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid rgba(255,255,255,.08)}
.nav::-webkit-scrollbar{display:none}
.nav-item{position:relative}
.nav-btn{background:none;border:0;color:#a9bdd2;padding:11px 13px;cursor:pointer;white-space:nowrap;font-weight:500;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center}
.nav-btn:hover{color:#fff}
.nav-btn.on{color:#fff;border-bottom-color:#19b3a9}
.nav-btn .n{font-family:var(--f-mono);font-size:11px;opacity:.6}
.nav-btn .cnt{background:#ef4444;color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:600}
.drop{position:fixed;min-width:230px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:70;animation:dd .16s ease-out}
@keyframes dd{from{transform:translateY(-4px);opacity:.3}to{transform:none;opacity:1}}
.drop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer}
.drop button:hover{background:var(--surface-2)}
.drop small{display:block;color:var(--muted);font-size:11.5px}

/* ---------- Lienzo ---------- */
main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.view{animation:vin .28s ease-out}
@keyframes vin{from{transform:translateY(6px);opacity:.35}to{transform:none;opacity:1}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:24px}
.crumb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.sub{color:var(--muted);max-width:70ch;margin:4px 0 0}
.sample{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:var(--warn);background:var(--warn-soft);border-radius:20px;padding:3px 10px;font-weight:500}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;background:var(--surface-2);padding:4px;border-radius:10px;width:fit-content;max-width:100%}
.tab{background:none;border:0;padding:7px 13px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tab.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:15px;margin-bottom:2px}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--muted)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--accent))}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:210px}

/* ---------- Filtros y tablas ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
.filters input[type=search]{flex:1 1 200px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:12.5px;display:flex;gap:6px;align-items:center;transition:background .15s}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on b{color:#9fd9d4}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer;transition:background .12s}
tr.row:hover td{background:var(--surface-2)}
td.obs{max-width:300px;color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}.p-info{background:var(--info-soft);color:var(--info)}
.p-vio{background:var(--violet-soft);color:var(--violet)}.p-mut{background:var(--surface-2);color:var(--muted)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:12.5px;color:var(--muted);gap:8px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- Alertas ---------- */
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);animation:vin .3s ease-out both}
.alert .sev{width:9px;height:9px;border-radius:50%;margin-top:6px}
.alert.crit .sev{background:var(--crit);box-shadow:0 0 0 4px var(--crit-soft)}
.alert.warn .sev{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.alert.info .sev{background:var(--info);box-shadow:0 0 0 4px var(--info-soft)}
.alert .t{font-weight:600}
.alert .d{color:var(--muted);font-size:12.5px}
.alert.read{opacity:.55}

/* ---------- Panel lateral ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.45);z-index:80;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:90;box-shadow:-10px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;animation:slide .25s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
.dr-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dr-h h2{font-size:18px}
.dr-b{padding:16px 18px;overflow-y:auto;flex:1;display:grid;gap:16px;align-content:start}
.x{margin-left:auto;background:var(--surface-2);border:0;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kv span{overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.timeline li:last-child{border-left-color:transparent}
.timeline li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.timeline small{color:var(--muted)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{flex:1 1 80px;text-align:center;font-size:11px;padding:6px 4px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-weight:600}
.step.done{background:var(--accent-soft);color:var(--accent)}
.step.cur{background:var(--accent);color:#fff}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:5px;transition:width .5s}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);resize:vertical}

/* ---------- Varios ---------- */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;padding:11px 14px;border-radius:9px;box-shadow:var(--shadow);animation:slide .25s ease-out;font-size:13px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:stretch}
.flow .node{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--surface-2);text-align:center}
.flow .node b{display:block;font-family:var(--f-display);font-size:22px}
.flow .node small{color:var(--muted);font-size:11.5px}
.drop-zone{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);transition:border-color .2s,background .2s}
.drop-zone.over{border-color:var(--accent);background:var(--accent-soft)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.find{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:0}
.find p{margin:3px 0 0;color:var(--muted)}
.prose{max-width:75ch}
.prose li{margin-bottom:6px}
.lock{padding:40px;text-align:center}
.lock h2{font-size:20px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:640px){.head h1{font-size:20px}.kpi .val{font-size:24px}.who span{display:none}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><div class="brand-mark">CA</div>Centro de Autorizaciones</div>
    <div class="top-right">
      <label class="who"><span>Ver como</span>
        <select id="userSel" aria-label="Usuario simulado"></select>
      </label>
      <button class="bell" id="bellBtn" aria-label="Mis alertas">Alertas <span class="dot" id="bellDot" hidden>0</span></button>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Módulos"></nav>
</header>
<main id="main"></main>
<div class="toasts" id="toasts"></div>
<div id="layer"></div>

<script>
/* =========================================================
   DATOS DE EJEMPLO (generados, ficticios). Fecha de corte fija.
   ========================================================= */
const HOY = new Date('2026-11-14T10:00:00');
const DAY = 864e5, HOUR = 36e5;
let seed = 20261114;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const pick = a => a[Math.floor(rnd()*a.length)];
const int = (a,b) => a + Math.floor(rnd()*(b-a+1));
const wpick = (pairs) => {let s=pairs.reduce((a,p)=>a+p[1],0),r=rnd()*s;for(const p of pairs){if((r-=p[1])<=0)return p[0]}return pairs[0][0]};
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => d ? d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'}) : '—';
const fmtDT = d => d ? d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : '—';
const money = v => '$'+Math.round(v).toLocaleString('es-CO');
const moneyM = v => '$'+(v/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+' M';

const NOMBRES=['ANA','LUIS','MARIA','JOSE','CARMEN','JUAN','ROSA','PEDRO','LUZ','JESUS','SANDRA','CARLOS','YURANI','EDWIN','DIANA','OSCAR','NELLY','WILSON','LEIDY','HECTOR'];
const APELLIDOS=['PEREZ','GOMEZ','RODRIGUEZ','MARTINEZ','LOPEZ','DIAZ','TORRES','RAMIREZ','VARGAS','CASTRO','ROJAS','SUAREZ','MORENO','PARRA','CHAPARRO','BARRERA','FONSECA','CAMARGO'];

const AREAS=[
  {n:'URGENCIAS',cama:false,w:16},
  {n:'HOSPITALIZACION 4 PISO',cama:true,pab:['PABELLON A','PABELLON B','PABELLON C'],pre:'H4',w:20},
  {n:'HOSPITALIZACION 3 PISO',cama:true,pre:'H3',w:12},

  {n:'CONSULTA EXTERNA',cama:false,w:18},
  {n:'CIRUGIA AMBULATORIA',cama:false,w:6},
];
const EPS=[
  {erp:'CAPRESOCA',contratos:['101','102','SIN CONTRATO'],w:30},
  {erp:'NUEVA EPS',contratos:['201','SIN CONTRATO'],w:22},
  {erp:'SANITAS',contratos:['301'],w:12},
  {erp:'COOSALUD',contratos:['401','SIN CONTRATO'],w:10},
  {erp:'FAMISANAR',contratos:['501'],w:7},
];
const SOAT_ASEG=['SEGUROS DEL ESTADO','LA PREVISORA','SURA SOAT','MUNDIAL SEGUROS'];
const SERVICIOS=['TAC DE CRANEO','RESONANCIA MAGNETICA','ECOCARDIOGRAMA','CIRUGIA ORTOPEDICA','INTERCONSULTA NEUROCIRUGIA','REMISION NIVEL III','MEDICAMENTO NO PBS','HEMODIALISIS','ESTANCIA ADICIONAL','ENDOSCOPIA'];
const CAT_LBL={REGULAR:'Régimen con pagador',SOAT:'SOAT definido',SOAT_SIN_DOC:'SOAT sin documentos',SIN_SS:'Sin seguridad social',NEONATO:'Neonato sin seguridad social'};

const USERS=[
  {id:'u1',nombre:'Laura Méndez',rol:'ADMIN',area:'*'},
  {id:'u2',nombre:'Carlos Pérez',rol:'COORD_GENERAL',area:'*'},
  {id:'u3',nombre:'Diana Rojas',rol:'COORD_AREA',area:'HOSPITALIZACION 4 PISO'},
  {id:'u4',nombre:'Jorge Silva',rol:'AUTORIZADOR',area:'*'},
  {id:'u5',nombre:'Paola Gómez',rol:'AUTORIZADOR',area:'*'},
  {id:'u6',nombre:'Mario Torres',rol:'GESTOR_CASOS',area:'*'},
  {id:'u7',nombre:'Sofía Ávila',rol:'PENDIENTE',area:'URGENCIAS'},
];
const ROL_LBL={ADMIN:'Administrador',COORD_GENERAL:'Coordinador general',COORD_AREA:'Coordinador de área',AUTORIZADOR:'Autorizador',GESTOR_CASOS:'Gestor de casos especiales',PENDIENTE:'Pendiente de aprobación'};
const AUTORIZADORES=['Jorge Silva','Paola Gómez'];
const CARGADORES=['ADMISIONES URG 1','ADMISIONES URG 2','ADMISIONES CE','FACTURACION PISO 4','FACTURACION PISO 3'];

const PARAM={slaHoras:48,critHoras:72,diasCE:3,diasSoatDoc:5,diasProlongado:30};

/* ---- Ingresos (carga actual + carga anterior) ---- */
function persona(cat){
  const edad = cat==='NEONATO'?0:int(1,88);
  const nom = cat==='NEONATO' ? 'RN HIJO DE '+pick(NOMBRES)+' '+pick(APELLIDOS) : pick(NOMBRES)+' '+pick(APELLIDOS)+' '+pick(APELLIDOS);
  const tipo = cat==='NEONATO' ? 'MS' : edad<18 ? 'TI' : 'CC';
  const doc = cat==='NEONATO' ? 'MS'+int(100000,999999) : String(int(1000000,1199999999));
  return {paciente:nom,edad,tipoId:tipo,documento:doc};
}
const INGRESOS=[];
for(let i=0;i<170;i++){
  const cat = wpick([['REGULAR',68],['SOAT',8],['SOAT_SIN_DOC',8],['SIN_SS',10],['NEONATO',6]]);
  let areaObj = cat==='NEONATO' ? pick([AREAS[4],AREAS[5]]) : wpick(AREAS.map(a=>[a,a.w]));
  if((cat==='SOAT'||cat==='SOAT_SIN_DOC') && areaObj.n==='CONSULTA EXTERNA') areaObj = AREAS[0];
  const area = areaObj.n;
  const ce = area==='CONSULTA EXTERNA';
  const dias = ce ? wpick([[int(0,2),5],[int(3,12),5],[int(13,40),2]]) : wpick([[int(0,6),6],[int(7,29),5],[int(30,95),3]]);
  const fIng = new Date(HOY - dias*DAY - int(0,20)*HOUR);
  const egreso = !ce && rnd()<0.17;
  const pab = areaObj.pab ? pick(areaObj.pab) : '';
  let cama='';
  if(areaObj.cama && (!egreso || rnd()<0.35)) cama = areaObj.pre + (pab?pab.slice(-1):'') + '-' + String(int(1,30)).padStart(2,'0');
  if(area==='URGENCIAS' && !egreso && rnd()<0.25) cama = 'OBS-'+String(int(1,12)).padStart(2,'0');
  let erp,contrato;
  if(cat==='REGULAR'){const e=wpick(EPS.map(x=>[x,x.w]));erp=e.erp;contrato=pick(e.contratos)}
  else if(cat==='SOAT'){erp=pick(SOAT_ASEG);contrato='SOAT'}
  else if(cat==='SOAT_SIN_DOC'){erp='ACCIDENTE SIN DOCUMENTOS';contrato='POR DEFINIR'}
  else {erp='SIN SEGURIDAD SOCIAL';contrato='DEPARTAMENTAL'}
  const p = persona(cat);
  INGRESOS.push({
    ingreso: String(880000+i*37+int(0,30)),
    fechaIng:fIng, area, pabellon:pab, cama, egreso,
    fechaEgr: egreso ? new Date(Math.min(+HOY-HOUR, +fIng + int(1,Math.max(1,dias))*DAY)) : null,
    erp, contrato, cat, catOrigen:cat, ...p,
    valor: ce ? int(40,600)*1000 : int(300,48000)*1000,
    usuario: ce ? 'ADMISIONES CE' : pick(CARGADORES),
    diagEgreso: egreso && rnd()<0.8 ? pick(['S062','K359','J189','O800','I219','N390']) : '',
    enCargaActual:true, enCargaAnterior: dias>=1,
    obs:''
  });
}
/* Simular cambios entre cargas: casos que salieron (presunto facturado) y que cambiaron de pagador */
INGRESOS.filter(x=>x.cat!=='REGULAR').forEach((x,k)=>{
  if(x.cat==='SOAT_SIN_DOC' && k%3===0){x.cat='SOAT';x.erp=pick(SOAT_ASEG);x.contrato='SOAT';x.cambioFecha=new Date(HOY-int(1,6)*DAY)}
  if((x.cat==='SIN_SS'||x.cat==='NEONATO') && k%3===1){const e=wpick(EPS.map(z=>[z,z.w]));x.cat='REGULAR';x.erp=e.erp;x.contrato=e.contratos[0];x.cambioFecha=new Date(HOY-int(1,6)*DAY)}
  if(k%4===2 && x.enCargaAnterior){x.enCargaActual=false}
});
INGRESOS.filter(x=>x.catOrigen==='REGULAR' && x.enCargaAnterior).forEach((x,k)=>{if(k%14===0)x.enCargaActual=false});

/* ---- Autorizaciones ---- */
const ESTADOS_AUT=['SOLICITADA','RADICADA','EN TRAMITE','AUTORIZADA'];
const AUTS=[];
const candidatos = INGRESOS.filter(x=>x.area!=='CONSULTA EXTERNA' && x.enCargaActual);
for(let i=0;i<120;i++){
  const ing = pick(candidatos);
  const est = wpick([['SOLICITADA',14],['RADICADA',16],['EN TRAMITE',16],['AUTORIZADA',46],['NEGADA',8]]);
  const fSol = new Date(Math.max(+ing.fechaIng, HOY - int(2,60)*DAY) + int(1,10)*HOUR);
  const ger = pick(AUTORIZADORES);
  const durBase = {CAPRESOCA:30,'NUEVA EPS':62,SANITAS:22,COOSALUD:54,FAMISANAR:36}[ing.erp] || 44;
  const dur = Math.max(2, durBase*(0.4+rnd()*1.4));
  const hist=[{f:fSol,u:ger,t:'Solicitud registrada · '+'servicio enviado por '+ing.area}];
  let fRad=null,fResp=null;
  if(est!=='SOLICITADA'){fRad=new Date(+fSol+int(1,8)*HOUR);hist.push({f:fRad,u:ger,t:'Radicada ante '+ing.erp+' · radicado '+int(10000,99999)})}
  if(est==='EN TRAMITE'){hist.push({f:new Date(+fRad+int(4,20)*HOUR),u:ger,t:'EPS solicita soportes adicionales (historia clínica)'})}
  if(est==='AUTORIZADA'||est==='NEGADA'){fResp=new Date(+fSol+dur*HOUR);if(fResp>HOY)fResp=new Date(HOY-HOUR);hist.push({f:fResp,u:ger,t:est==='AUTORIZADA'?'Autorizada · N° '+int(1e6,9e6):'Negada por '+ing.erp+' · no pertinencia'})}
  AUTS.push({id:'A-'+(5200+i),ingreso:ing.ingreso,documento:ing.documento,paciente:ing.paciente,erp:ing.erp,area:ing.area,
    servicio:pick(SERVICIOS),estado:est,fSol,fRad,fResp,gestor:ger,prioridad:wpick([['ALTA',3],['MEDIA',5],['BAJA',2]]),hist});
}
const abiertaAut = a => !['AUTORIZADA','NEGADA'].includes(a.estado);
const horasAut = a => ((a.fResp||HOY)-a.fSol)/HOUR;

/* Observaciones del ingreso (refiere si hay autorizaciones pendientes) */
INGRESOS.forEach(x=>{
  const pend = AUTS.filter(a=>a.ingreso===x.ingreso && abiertaAut(a));
  x.autPend = pend.length;
  const parts=[];
  if(pend.length) parts.push('PENDIENTE AUT. '+pend.map(a=>a.servicio).join(', ')+' - '+x.erp);
  else parts.push('SIN AUTORIZACIONES PENDIENTES');
  if(x.cat==='SOAT_SIN_DOC') parts.push('FALTA FURIPS / POLIZA');
  if(x.catOrigen==='SIN_SS'||x.catOrigen==='NEONATO') parts.push(x.cat==='REGULAR'?'AFILIADO A '+x.erp:'EN TRAMITE AFILIACION');
  if(x.area==='CONSULTA EXTERNA') parts.push('PENDIENTE CIERRE DE ATENCION');
  x.obs = parts.join(' · ');
});

/* Situación derivada de cada ingreso */
function situacion(x){
  if(x.area==='CONSULTA EXTERNA') return 'CE';
  if(x.egreso && x.cama) return 'CAMA_NO_LIBERADA';
  if(x.egreso) return 'EGRESADO_ABIERTO';
  if(x.cama) return 'HOSPITALIZADO';
  return 'EN_ATENCION';
}
const SIT_LBL={HOSPITALIZADO:'Hospitalizado',CE:'Consulta externa',EGRESADO_ABIERTO:'Egresado sin cerrar',CAMA_NO_LIBERADA:'Egresado con cama',EN_ATENCION:'En atención'};
const SIT_PILL={HOSPITALIZADO:'p-info',CE:'p-vio',EGRESADO_ABIERTO:'p-warn',CAMA_NO_LIBERADA:'p-crit',EN_ATENCION:'p-mut'};
const diasAbierto = x => Math.floor((HOY-x.fechaIng)/DAY);

/* ---- Casos especiales (SOAT / sin seguridad social / neonatos) ---- */
const DOCS_SOAT=['FURIPS diligenciado','Póliza SOAT vigente','Documento de identidad','Informe de tránsito o declaración','Epicrisis / resumen de atención'];
const DOCS_SSS=['Consulta ADRES / BDUA','Encuesta SISBEN','Solicitud de afiliación','Registro civil (neonatos)','Notificación a ente territorial'];
const CASOS=INGRESOS.filter(x=>x.catOrigen!=='REGULAR').map((x,i)=>{
  const soat = x.catOrigen.startsWith('SOAT');
  const docs = (soat?DOCS_SOAT:DOCS_SSS).map((d,j)=>({d,ok: x.cat!==x.catOrigen || x.catOrigen==='SOAT' ? rnd()<0.85 : rnd()<0.4}));
  const fCaso = new Date(+x.fechaIng + int(1,6)*HOUR);
  const bit=[{f:fCaso,u:'Mario Torres',t:'Caso abierto como '+CAT_LBL[x.catOrigen]}];
  if(soat) bit.push({f:new Date(+fCaso+int(5,30)*HOUR),u:'Mario Torres',t:'Solicitud de documentos al acompañante'});
  if(x.cat!==x.catOrigen) bit.push({f:x.cambioFecha,u:'Sistema (carga)',t:'Cambio de pagador detectado: '+CAT_LBL[x.catOrigen]+' → '+x.erp});
  if(!x.enCargaActual) bit.push({f:new Date(HOY-int(0,2)*DAY),u:'Sistema (carga)',t:'El ingreso ya no aparece en ingresos abiertos (presunto facturado)'});
  return {id:'C-'+(300+i),ref:x,grupo:soat?'SOAT':'SSS',docs,bit,cerrado: !x.enCargaActual && i%3===0,
    fAccidente: soat ? new Date(+x.fechaIng - int(0,1)*DAY) : null, gestor:'Mario Torres'};
});
function estadoCaso(c){
  if(c.cerrado) return 'CERRADO';
  if(!c.ref.enCargaActual) return 'FACTURADO_SIN_CIERRE';
  if(c.ref.cat!==c.ref.catOrigen) return 'PAGADOR_ASIGNADO';
  return 'EN_GESTION';
}
const EC_LBL={EN_GESTION:'En gestión',PAGADOR_ASIGNADO:'Pagador asignado',FACTURADO_SIN_CIERRE:'Salió de abiertos · sin cierre',CERRADO:'Cerrado'};
const EC_PILL={EN_GESTION:'p-warn',PAGADOR_ASIGNADO:'p-info',FACTURADO_SIN_CIERRE:'p-crit',CERRADO:'p-ok'};

const S={user:USERS[0],view:'inicio',f:{},sort:{},page:{},read:new Set()};
const can = (mod,lvl=1) => (PERM[mod]?.[S.user.rol]||0) >= lvl;

const autVisibles = () => AUTS.filter(a=>enMiArea(a.area));

/* Alertas por usuario (motor de reglas) */
function alertasDe(u){
  const out=[];
  const misAut = AUTS.filter(a=>a.gestor===u.nombre && abiertaAut(a));
  if(u.rol==='AUTORIZADOR'){
    const venc = misAut.filter(a=>horasAut(a)>PARAM.critHoras);
    const riesgo = misAut.filter(a=>horasAut(a)>PARAM.slaHoras && horasAut(a)<=PARAM.critHoras);
    if(venc.length) out.push({id:'a-venc',sev:'crit',t:`Tienes ${venc.length} trámites con más de ${PARAM.critHoras} h sin respuesta`,d:'Más antiguo: '+venc.sort((a,b)=>horasAut(b)-horasAut(a))[0].id+' · '+venc[0].erp,go:'aut-mias'});
    if(riesgo.length) out.push({id:'a-riesgo',sev:'warn',t:`${riesgo.length} trámites superan la meta de ${PARAM.slaHoras} h`,d:'Haz seguimiento con la EPS antes de que pasen a crítico.',go:'aut-mias'});
    const sinRad = misAut.filter(a=>a.estado==='SOLICITADA');
    if(sinRad.length) out.push({id:'a-sinrad',sev:'info',t:`${sinRad.length} solicitudes aún sin radicar`,d:'Regístralas ante la EPS y anota el número de radicado.',go:'aut-mias'});
  }
  if(u.rol==='GESTOR_CASOS'||u.rol==='ADMIN'||u.rol==='COORD_GENERAL'){
    const fs = CASOS.filter(c=>estadoCaso(c)==='FACTURADO_SIN_CIERRE');
    if(fs.length) out.push({id:'c-fs',sev:'crit',t:`${fs.length} casos especiales salieron de ingresos abiertos sin cierre`,d:'Carga el soporte (factura o pagador) y cierra cada caso para que no quede la trazabilidad incompleta.',go: fs.some(c=>c.grupo==='SOAT')?'soat':'sss-fact'});
    const sd = CASOS.filter(c=>c.grupo==='SOAT' && c.ref.cat==='SOAT_SIN_DOC' && c.ref.enCargaActual && diasAbierto(c.ref)>PARAM.diasSoatDoc);
    if(sd.length) out.push({id:'c-sd',sev:'warn',t:`${sd.length} accidentes de tránsito llevan más de ${PARAM.diasSoatDoc} días sin documentos`,d:'Sin FURIPS ni póliza no se puede facturar al SOAT ni a ADRES.',go:'soat-sindoc'});
    const pa = CASOS.filter(c=>estadoCaso(c)==='PAGADOR_ASIGNADO');
    if(pa.length) out.push({id:'c-pa',sev:'info',t:`${pa.length} casos cambiaron a pagador asignado desde la última carga`,d:'Revisa que el contrato quedó bien asignado.',go:'soat-cambio'});
  }
  if(u.rol==='COORD_AREA'||u.rol==='ADMIN'||u.rol==='COORD_GENERAL'){
    const scope = INGRESOS.filter(x=>x.enCargaActual && (u.area==='*'||x.area===u.area));
    const ce = scope.filter(x=>situacion(x)==='CE' && diasAbierto(x)>PARAM.diasCE);
    if(ce.length) out.push({id:'i-ce',sev:'warn',t:`${ce.length} atenciones de consulta externa superan ${PARAM.diasCE} días sin cerrar`,d:'No llevan egreso, pero deben cerrarse para poder facturar.',go:'ing-ce'});
    const cnl = scope.filter(x=>situacion(x)==='CAMA_NO_LIBERADA');
    if(cnl.length) out.push({id:'i-cnl',sev:'crit',t:`${cnl.length} pacientes egresados siguen con cama asignada`,d:'La cama no se liberó o el ingreso no se cerró.',go:'ing'});
    const hp = scope.filter(x=>situacion(x)==='HOSPITALIZADO' && x.autPend>0);
    if(hp.length) out.push({id:'i-hp',sev:'info',t:`${hp.length} hospitalizados tienen autorizaciones pendientes`,d:u.area==='*'?'Todas las áreas':u.area,go:'ing-hosp'});
  }
  if(u.rol==='ADMIN'){
    const p = USERS.filter(x=>x.rol==='PENDIENTE');
    if(p.length) out.push({id:'u-pend',sev:'info',t:`${p.length} solicitud de registro esperando aprobación`,d:p.map(x=>x.nombre).join(', '),go:'admin'});
  }
  return out;
}

const $ = s => document.querySelector(s);
function modOf(view){return MODULOS.find(m=>m.sub.some(s=>s[0]===view))||MODULOS[0]}
function renderUserSel(){
  $('#userSel').innerHTML = USERS.filter(u=>u.rol!=='PENDIENTE').map(u=>`<option value="${u.id}" ${u===S.user?'selected':''}>${esc(u.nombre)} · ${ROL_LBL[u.rol]}</option>`).join('');
}
function renderNav(){
  const al = alertasDe(S.user).filter(a=>!S.read.has(a.id));
  const cur = modOf(S.view).id;
  $('#nav').innerHTML = MODULOS.filter(m=>can(m.id)).map(m=>{
    let cnt='';
    if(m.id==='inicio' && al.length) cnt=`<span class="cnt">${al.length}</span>`;
    if(m.id==='admin'){const p=USERS.filter(u=>u.rol==='PENDIENTE').length;if(p)cnt=`<span class="cnt">${p}</span>`}
    return `<div class="nav-item"><button class="nav-btn ${cur===m.id?'on':''}" data-mod="${m.id}" aria-haspopup="${m.sub.length>1}"><span class="n">${m.n}</span>${m.t}${cnt}</button></div>`}).join('');
  const dot=$('#bellDot'); dot.hidden=!al.length; dot.textContent=al.length; dot.classList.toggle('pulse',al.some(a=>a.sev==='crit'));
}
let dropEl=null, dropTimer=null;
function closeDrop(){if(dropEl){dropEl.remove();dropEl=null}}
function openDrop(btn){
  const m = MODULOS.find(x=>x.id===btn.dataset.mod);
  closeDrop();
  if(m.sub.length<2) return;
  const r = btn.getBoundingClientRect();
  dropEl = document.createElement('div'); dropEl.className='drop';
  dropEl.style.top=(r.bottom+4)+'px'; dropEl.style.left=Math.max(8,Math.min(r.left, innerWidth-250))+'px';
  dropEl.innerHTML = m.sub.map(s=>`<button data-go="${s[0]}">${s[1]}</button>`).join('');
  dropEl.addEventListener('mouseenter',()=>clearTimeout(dropTimer));
  dropEl.addEventListener('mouseleave',()=>{dropTimer=setTimeout(closeDrop,200)});
  document.body.appendChild(dropEl);
}
$('#nav').addEventListener('mouseover',e=>{const b=e.target.closest('.nav-btn');if(b&&matchMedia('(hover:hover)').matches){clearTimeout(dropTimer);openDrop(b)}});
$('#nav').addEventListener('mouseleave',()=>{dropTimer=setTimeout(closeDrop,250)});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('.nav-btn');if(!b)return;const m=MODULOS.find(x=>x.id===b.dataset.mod);
  if(m.sub.length>1 && !matchMedia('(hover:hover)').matches && !dropEl){openDrop(b);return}
  closeDrop();go(m.sub[0][0])});
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();closeDrop();go(g.dataset.go);return}
  if(dropEl && !e.target.closest('.drop') && !e.target.closest('.nav-btn'))closeDrop()});
$('#bellBtn').addEventListener('click',()=>go('inicio'));
$('#userSel').addEventListener('change',e=>{S.user=USERS.find(u=>u.id===e.target.value);S.f={};toast('Ahora ves la plataforma como '+S.user.nombre+' ('+ROL_LBL[S.user.rol]+')');
  if(!can(modOf(S.view).id)) S.view='inicio'; render()});
function go(v){$('#layer').innerHTML='';S.view=v; try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v} render(); scrollTo({top:0,behavior:'smooth'})}
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==S.view&&MODULOS.some(m=>m.sub.some(s=>s[0]===v))){S.view=v;render()}});

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}

const charts={};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function chart(id,cfg){
  if(typeof Chart==='undefined'){const el=document.getElementById(id);if(el)el.parentElement.innerHTML='<div class="empty">Los gráficos necesitan conexión a internet.</div>';return}
  if(charts[id]) charts[id].destroy();
  const el=document.getElementById(id); if(!el) return;
  const fg=css('--muted'), grid=css('--line');
  Chart.defaults.font.family='IBM Plex Sans, system-ui, sans-serif'; Chart.defaults.color=fg;
  cfg.options = Object.assign({responsive:true,maintainAspectRatio:false,animation:{duration:matchMedia('(prefers-reduced-motion: reduce)').matches?0:700},
    plugins:{legend:{labels:{boxWidth:10,boxHeight:10,usePointStyle:true}},tooltip:{backgroundColor:css('--ink'),padding:10,cornerRadius:8}}},cfg.options||{});

const PAL=()=>[css('--accent'),css('--accent-2'),css('--warn'),css('--violet'),css('--crit'),css('--ok'),'#64748b','#0ea5e9'];
function countUp(root){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-count]').forEach(el=>{
    const end=+el.dataset.count, fmt=el.dataset.fmt;
    const f = v => fmt==='m'?moneyM(v):fmt==='h'?Math.round(v)+' h':fmt==='p'?Math.round(v)+'%':Math.round(v).toLocaleString('es-CO');
    if(reduce){el.textContent=f(end);return}
    const t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/700);el.textContent=f(end*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};
    el.textContent=f(0); requestAnimationFrame(step);
  });
}
function kpi(lbl,val,foot,color,goView,fmt){

}
function groupCount(arr,key,valFn){const m=new Map();arr.forEach(x=>{const k=typeof key==='function'?key(x):x[key];m.set(k,(m.get(k)||0)+(valFn?valFn(x):1))});return [...m.entries()].sort((a,b)=>b[1]-a[1])}

/* Tabla genérica con orden y paginación */
function table(key,cols,rows,onRow){
  const st=S.sort[key]||{}; const pg=S.page[key]||0; const per=15;
  if(st.c!=null){const c=cols[st.c];rows=[...rows].sort((a,b)=>{const va=c.s?c.s(a):'',vb=c.s?c.s(b):'';return (va>vb?1:va<vb?-1:0)*(st.d||1)})}
  const total=rows.length, pages=Math.max(1,Math.ceil(total/per)), p=Math.min(pg,pages-1);
  const slice=rows.slice(p*per,p*per+per);
  const head=cols.map((c,i)=>`<th data-sort="${key}:${i}">${c.h}${st.c===i?(st.d>0?' ▲':' ▼'):''}</th>`).join('');
  const body=slice.length?slice.map((r,i)=>`<tr class="row" data-row="${key}:${p*per+i}">${cols.map(c=>`<td class="${c.cl||''}">${c.v(r)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}"><div class="empty">No hay registros con estos filtros.</div></td></tr>`;
  TBL[key]={rows,onRow};
  return `<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
  <div class="pager"><span class="num">${total} registros</span><span>
  <button class="btn ghost sm" data-pg="${key}:${p-1}" ${p===0?'disabled':''}>Anterior</button>
  <span class="num">&nbsp;${p+1} / ${pages}&nbsp;</span>
  <button class="btn ghost sm" data-pg="${key}:${p+1}" ${p>=pages-1?'disabled':''}>Siguiente</button></span></div></div>`;
}

  const pg=e.target.closest('[data-pg]'); if(pg){const [k,p]=pg.dataset.pg.split(':');S.page[k]=+p;render(false);return}
  const tr=e.target.closest('[data-row]'); if(tr){const [k,i]=tr.dataset.row.split(':');const t=TBL[k];if(t&&t.onRow)t.onRow(t.rows[+i]);return}
  const ch=e.target.closest('[data-chip]'); if(ch){const [k,v]=ch.dataset.chip.split('=');S.f[k]=S.f[k]===v?'':v;resetPages();render(false);return}
});

  const f=S.f;

  if(f.aErp) rows=rows.filter(a=>a.erp===f.aErp);

  if(f.aSla) rows=rows.filter(a=>f.aSla==='crit'?horasAut(a)>PARAM.critHoras:f.aSla==='riesgo'?horasAut(a)>PARAM.slaHoras&&horasAut(a)<=PARAM.critHoras:horasAut(a)<=PARAM.slaHoras);
  if(f.aQ){const q=f.aQ.toUpperCase();rows=rows.filter(a=>(a.paciente+a.documento+a.ingreso+a.id+a.servicio).toUpperCase().includes(q))}
  const crit=base.filter(a=>horasAut(a)>PARAM.critHoras).length, ries=base.filter(a=>horasAut(a)>PARAM.slaHoras&&horasAut(a)<=PARAM.critHoras).length;

  (scope!=='hist'?`<div class="chips">
    <button class="chip ${f.aSla==='crit'?'on':''}" data-chip="aSla=crit">Críticas <b>${crit}</b></button>

  </div>`+
  table('aut-'+scope,[
    {h:'Trámite',v:a=>`<span class="mono">${a.id}</span>`,s:a=>a.id},

  if(f.iQ){const q=f.iQ.toUpperCase();rows=rows.filter(x=>(x.paciente+x.documento+x.ingreso+x.cama+x.obs).toUpperCase().includes(q))}

  `<div class="grid g-kpi" style="margin-bottom:14px">

function vCasos(grupo,scope){
  const mod=grupo==='SOAT'?'soat':'sss';
  if(!can(mod)) return locked();
  let base=CASOS.filter(c=>c.grupo===grupo&&enMiArea(c.ref.area));
  let rows=base;
  if(scope==='sindoc') rows=rows.filter(c=>c.ref.cat==='SOAT_SIN_DOC');
  if(scope==='cambio') rows=rows.filter(c=>c.ref.cat!==c.ref.catOrigen);
  if(scope==='neo') rows=rows.filter(c=>c.ref.catOrigen==='NEONATO');
  if(scope==='fact') rows=rows.filter(c=>!c.ref.enCargaActual);
  const f=S.f;
  if(f.cEst) rows=rows.filter(c=>estadoCaso(c)===f.cEst);
  if(f.cQ){const q=f.cQ.toUpperCase();rows=rows.filter(c=>(c.ref.paciente+c.ref.documento+c.ref.ingreso+c.id).toUpperCase().includes(q))}
  const ec=groupCount(base,estadoCaso);
  const docsPct=c=>Math.round(100*c.docs.filter(d=>d.ok).length/c.docs.length);
  const titles={all:grupo==='SOAT'?'Accidentes de tránsito (SOAT)':'Sin seguridad social y neonatos',sindoc:'SOAT sin documentos',cambio:'Pasaron a pagador asignado',neo:'Neonatos sin seguridad social',fact:'Salieron de ingresos abiertos'};
  const subs={all:grupo==='SOAT'?'Control de cada accidente: documentos, cambio de “sin documentos” a aseguradora y cierre.':'Control de pacientes sin afiliación hasta que tienen pagador o se facturan.',
    sindoc:'Accidentes sin FURIPS o póliza. Sin estos soportes no se puede cobrar al SOAT ni a ADRES.',cambio:'Casos que entre cargas pasaron de no tener pagador a tener uno.',neo:'Recién nacidos sin registro ni afiliación.',fact:'Si ya no están en ingresos abiertos es porque se facturaron. El gestor debe cargar el soporte y cerrar el caso.'};
  const flow = grupo==='SOAT'
    ? [['Sin documentos',base.filter(c=>c.ref.catOrigen==='SOAT_SIN_DOC').length],['SOAT definido',base.filter(c=>c.ref.cat==='SOAT').length],['Salieron de abiertos',base.filter(c=>!c.ref.enCargaActual).length],['Cerrados',base.filter(c=>c.cerrado).length]]
    : [['Sin seguridad / neonato',base.length],['Pagador asignado',base.filter(c=>c.ref.cat!==c.ref.catOrigen).length],['Salieron de abiertos',base.filter(c=>!c.ref.enCargaActual).length],['Cerrados',base.filter(c=>c.cerrado).length]];
  return head((grupo==='SOAT'?'03 · SOAT':'04 · Sin seguridad social'),titles[scope],subs[scope])+subtabs()+
  `<div class="flow" style="margin-bottom:14px">${flow.map((n,i)=>`<div class="node"><b class="num">${n[1]}</b><small>${n[0]}</small></div>`).join('')}</div>
  <div class="chips">${ec.map(([k,n])=>`<button class="chip ${f.cEst===k?'on':''}" data-chip="cEst=${k}">${EC_LBL[k]} <b>${n}</b></button>`).join('')}</div>
  <div class="filters"><input type="search" placeholder="Buscar paciente, documento, ingreso o caso" data-fs="cQ" value="${esc(f.cQ||'')}" aria-label="Buscar"></div>`+
  table('casos-'+grupo+scope,[
    {h:'Caso',v:c=>`<span class="mono">${c.id}</span><br><small style="color:var(--muted)">ing ${c.ref.ingreso}</small>`,s:c=>c.id},
    {h:'Paciente',v:c=>`${esc(c.ref.paciente)}<br><span class="mono" style="color:var(--muted)">${c.ref.tipoId} ${c.ref.documento}</span>`,s:c=>c.ref.paciente},
    {h:'Área',v:c=>esc(c.ref.area),s:c=>c.ref.area},
    {h:'Origen → actual',v:c=>`${CAT_LBL[c.ref.catOrigen]}<br><small style="color:var(--muted)">→ ${esc(c.ref.erp)}</small>`,s:c=>c.ref.erp},
    {h:'Documentos',v:c=>`<div class="bar" style="width:90px" title="${docsPct(c)}%"><i style="width:${docsPct(c)}%"></i></div><small class="num">${docsPct(c)}%</small>`,s:docsPct},
    {h:'Días',v:c=>`<span class="num">${diasAbierto(c.ref)}</span>`,s:c=>diasAbierto(c.ref)},
    {h:'Estado del caso',v:c=>`<span class="pill ${EC_PILL[estadoCaso(c)]}">${EC_LBL[estadoCaso(c)]}</span>`,s:estadoCaso},
  ],rows,openCaso);
}

document.addEventListener('click',e=>{

  if(!obs){toast(n.dataset.cerrar?'Escribe el soporte del cierre (factura o pagador).':'Escribe la gestión antes de guardarla.');return}
  if(n.dataset.cerrar){c.cerrado=true;c.bit.push({f:new Date(),u:S.user.nombre,t:'Caso cerrado · '+obs});toast(c.id+' cerrado')}

V.med=()=>{
  if(!can('med')) return locked();
  const done=AUTS.filter(a=>a.estado==='AUTORIZADA');
  const avg=done.reduce((s,a)=>s+horasAut(a),0)/Math.max(1,done.length);
  const sorted=done.map(horasAut).sort((a,b)=>a-b); const med=sorted[Math.floor(sorted.length/2)]||0; const p90=sorted[Math.floor(sorted.length*.9)]||0;
  const cumple=100*done.filter(a=>horasAut(a)<=PARAM.slaHoras).length/Math.max(1,done.length);
  const open=INGRESOS.filter(x=>x.enCargaActual);
  return head('05 · Medición','Tablero gerencial','Tiempos de obtención, cumplimiento de la meta y concentración de pendientes. Mide desde la solicitud hasta la respuesta de la EPS.')+
  `<div class="grid g-kpi" style="margin-bottom:14px">
    ${kpi('Tiempo promedio',avg,'solicitud → autorización','--accent',null,'h')}
    ${kpi('Mediana',med,'la mitad se resuelve en menos','--accent-2',null,'h')}
    ${kpi('Percentil 90',p90,'los casos más lentos','--warn',null,'h')}
    ${kpi('Cumplimiento meta',cumple,'autorizadas en ≤ '+PARAM.slaHoras+' h','--ok',null,'p')}
    ${kpi('Valor abierto',open.reduce((s,x)=>s+x.valor,0),open.length+' ingresos','--violet','ing','m')}
  </div>
  <div class="grid g-2">
    <div class="card"><h3>ERP que más demoran en autorizar</h3><p class="hint">Horas promedio hasta la autorización. La línea marca la meta de ${PARAM.slaHoras} h.</p><div class="chart-box"><canvas id="cMedErp"></canvas></div></div>
    <div class="card"><h3>Áreas con más autorizaciones pendientes</h3><p class="hint">Pendientes abiertas por área, separadas por nivel de demora.</p><div class="chart-box"><canvas id="cMedArea"></canvas></div></div>
    <div class="card"><h3>Desempeño por autorizador</h3><p class="hint">Volumen gestionado y tiempo promedio de respuesta.</p><div class="chart-box sm"><canvas id="cMedGest"></canvas></div></div>
    <div class="card"><h3>Antigüedad de ingresos abiertos</h3><p class="hint">Días desde el ingreso hasta el corte.</p><div class="chart-box sm"><canvas id="cMedAge"></canvas></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Mapa de pendientes · área × ERP</h3><p class="hint">Más oscuro = más autorizaciones pendientes en ese cruce.</p><div id="heat" style="overflow-x:auto"></div></div>`;
};
V.med.after=()=>{
  const done=AUTS.filter(a=>a.estado==='AUTORIZADA');
  const erps=uniq(done.map(a=>a.erp)).map(e=>{const l=done.filter(a=>a.erp===e);return [e,l.reduce((s,a)=>s+horasAut(a),0)/l.length]}).sort((a,b)=>b[1]-a[1]);
  chart('cMedErp',{type:'bar',data:{labels:erps.map(e=>e[0]),datasets:[{label:'Horas promedio',data:erps.map(e=>Math.round(e[1])),backgroundColor:erps.map(e=>e[1]>PARAM.slaHoras?css('--crit'):css('--accent')),borderRadius:5},
    {label:'Meta',type:'line',data:erps.map(()=>PARAM.slaHoras),borderColor:css('--muted'),borderDash:[5,5],pointRadius:0}]},options:{plugins:{legend:{position:'bottom'}}}});
  const pend=AUTS.filter(abiertaAut); const areas=groupCount(pend,'area').map(a=>a[0]);
  chart('cMedArea',{type:'bar',data:{labels:areas.map(a=>a.replace('HOSPITALIZACION','HOSP.')),datasets:[
    {label:'En tiempo',data:areas.map(a=>pend.filter(x=>x.area===a&&horasAut(x)<=PARAM.slaHoras).length),backgroundColor:css('--ok'),borderRadius:3},
    {label:'Sobre la meta',data:areas.map(a=>pend.filter(x=>x.area===a&&horasAut(x)>PARAM.slaHoras&&horasAut(x)<=PARAM.critHoras).length),backgroundColor:css('--warn'),borderRadius:3},
    {label:'Críticas',data:areas.map(a=>pend.filter(x=>x.area===a&&horasAut(x)>PARAM.critHoras).length),backgroundColor:css('--crit'),borderRadius:3}]},
    options:{indexAxis:'y',scales:{x:{stacked:true},y:{stacked:true,ticks:{autoSkip:false}}},plugins:{legend:{position:'bottom'}}}});
  chart('cMedGest',{type:'bar',data:{labels:AUTORIZADORES,datasets:[
    {label:'Trámites',data:AUTORIZADORES.map(g=>AUTS.filter(a=>a.gestor===g).length),backgroundColor:css('--accent-2'),borderRadius:5,yAxisID:'y'},
    {label:'Horas promedio',type:'line',data:AUTORIZADORES.map(g=>{const l=done.filter(a=>a.gestor===g);return Math.round(l.reduce((s,a)=>s+horasAut(a),0)/Math.max(1,l.length))}),borderColor:css('--warn'),backgroundColor:css('--warn'),yAxisID:'y1'}]},
    options:{plugins:{legend:{position:'bottom'}},scales:{y1:{position:'right',grid:{display:false}}}}});
  const open=INGRESOS.filter(x=>x.enCargaActual); const b=[['0–3',0,3],['4–7',4,7],['8–15',8,15],['16–30',16,30],['31–60',31,60],['60+',61,999]];
  chart('cMedAge',{type:'bar',data:{labels:b.map(x=>x[0]+' d'),datasets:[{label:'Ingresos',data:b.map(x=>open.filter(i=>diasAbierto(i)>=x[1]&&diasAbierto(i)<=x[2]).length),backgroundColor:b.map((x,i)=>i<2?css('--accent'):i<4?css('--warn'):css('--crit')),borderRadius:5}]},options:{plugins:{legend:{display:false}}}});
  const ers=uniq(pend.map(a=>a.erp)), ars=uniq(pend.map(a=>a.area));
  const max=Math.max(1,...ars.flatMap(a=>ers.map(e=>pend.filter(x=>x.area===a&&x.erp===e).length)));
  $('#heat').innerHTML=`<table style="min-width:600px"><thead><tr><th>Área</th>${ers.map(e=>`<th style="text-align:center">${esc(e)}</th>`).join('')}</tr></thead><tbody>${ars.map(a=>`<tr><td>${esc(a)}</td>${ers.map(e=>{const n=pend.filter(x=>x.area===a&&x.erp===e).length;return `<td style="text-align:center;background:color-mix(in srgb,var(--crit) ${Math.round(n/max*70)}%,transparent);font-weight:${n?600:400}" class="num">${n||''}</td>`}).join('')}</tr>`).join('')}</tbody></table>`;
};

      <p class="hint" style="margin-top:10px">En este prototipo solo se valida el nombre del archivo; no se leen datos reales.</p></div>

  ${CARGAS.map(c=>`<tr><td>${fmtDT(c.f)}</td><td class="mono">${c.arch}</td><td>${esc(c.u)}</td><td class="num">${c.filas}</td><td class="num" style="color:var(--ok)">+${c.nuevos}</td><td class="num" style="color:var(--crit)">−${c.salieron}</td></tr>`).join('')}

V.carga.after=()=>{
  const dz=$('#dz'), fi=$('#fileIn'); if(!dz)return;
  const handle=file=>{if(!file)return;const ok=/\.(xlsx|xls|csv)$/i.test(file.name);
    $('#valid').innerHTML=ok?`<div class="alert info"><span class="sev"></span><div><div class="t">${esc(file.name)} recibido</div><div class="d">En la aplicación real aquí se validan las columnas, se compara con la carga anterior y se generan alertas de los casos que salieron. Este prototipo no procesa el archivo.</div></div><span></span></div>`:`<div class="alert crit"><span class="sev"></span><div><div class="t">Formato no válido</div><div class="d">Sube un archivo .xlsx, .xls o .csv.</div></div><span></span></div>`};
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
  dz.addEventListener('drop',e=>handle(e.dataTransfer.files[0])); fi.addEventListener('change',()=>handle(fi.files[0]));
};

V.rev=()=>{
  const F=(sev,t,d)=>`<div class="find"><span class="pill ${sev==='Alta'?'p-crit':sev==='Media'?'p-warn':'p-info'}">${sev}</span><div><b>${t}</b><p>${d}</p></div></div>`;
  return head('Revisión','Diagnóstico del proyecto actual','Revisión hecha a partir de la conversación compartida. Los archivos de código no se ven en el enlace, así que los hallazgos salen de lo que se pidió, se entregó y se reportó como probado.')+
  `<div class="grid g-2">
  <div class="card"><h3>Hallazgos</h3>
    ${F('Alta','Nunca se probó en Apps Script real','Cada entrega dice “no lo ejecuté en Apps Script”. El error “no se pudo guardar el proyecto” quedó sin causa. Lo primero es instalar la versión fuente (no la ofuscada) y corregir hasta que guarde y ejecute inicializarSistema.')}
    ${F('Alta','La versión ofuscada estorba más de lo que protege','Hace imposible depurar y es una causa probable del error al guardar (archivos muy grandes o sintaxis que el editor rechaza). El código del servidor (.gs) ya es invisible para los usuarios; basta con no compartir el proyecto ni la hoja.')}
    ${F('Alta','Datos de salud en una hoja de cálculo con acceso “Cualquier persona”','Con usuario y contraseña propios, la seguridad depende del código casero (PBKDF2 en Apps Script, sesiones en caché). Conviene publicar solo para el dominio de Google Workspace de la institución y usar la cuenta de Google como identidad.')}
    ${F('Media','El tiempo de autorización no es veraz','Se mide desde que se crea el registro hasta su última actualización. Falta guardar fecha de solicitud, de radicación ante la EPS y de respuesta, como campos propios.')}
    ${F('Media','Nombres de área y ERP distintos entre módulos','“Internación 4 piso” vs. “HOSPITALIZACION 4 PISO”, “CAPRESOCA 101” vs. “CAPRESOCA”. Se resolvió con parches (escribir ambos nombres con “;”). Hace falta un catálogo maestro con variantes.')}
    ${F('Media','“Salió de ingresos abiertos” se asume como facturado','Es una presunción. Debe quedar como “presunto facturado” hasta que el gestor cargue el soporte, y generar alerta si el caso especial no se cierra.')}
    ${F('Media','Roles cambiaron de nombre varias veces','OPERADOR → AUTORIZADOR, RESPONSABLE_AREA → COORDINADOR_AREA, y se agregó GESTOR. Una matriz de permisos por módulo evita reglas sueltas en el código.')}
    ${F('Baja','La última petición quedó a medias','Los 7 módulos (pendientes con alertas por usuario, ingresos, SOAT, sin seguridad social, medición, cargue e informes, administración) no se terminaron. Este prototipo los define.')}

</pre></div>
